<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#123FD6" />
<title>Vinci Compass Open</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script>try{if(localStorage.getItem("tt_theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --navy:#0522A6; --blue:#123FD6; --blue-2:#1560E0; --cyan:#00AEEF;
  --teal:#2FA98E; --green:#6DBE45; --wine:#8E3A63;
  --gold:#C8871A; --gold-soft:#F5E9CF; --silver:#8390B4; --silver-soft:#E9ECF5;
  --bronze:#A56A3A; --bronze-soft:#EFE0D2; --clay:#E0752B;
  --up:#2FA98E; --down:#8E3A63; --flat:#8C97B8; --live:#D2544E;
  --bg:#F5F7FB; --panel:#FFFFFF; --panel-2:#FBFCFE;
  --ink:#12204A; --ink-2:#4A567C; --ink-3:#8390B4;
  --line:#E4E9F4; --line-2:#EEF1F8; --brand-soft:#7FB0F2;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(9,26,84,.06), 0 8px 24px rgba(9,26,84,.05);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#070D24; --panel:#0F1738; --panel-2:#0C1330;
  --ink:#EAEEFB; --ink-2:#A9B4DA; --ink-3:#6E7AA6;
  --line:#1E2853; --line-2:#182146; --brand-soft:#7FB0F2;
  --gold:#E0A526; --gold-soft:#33291020; --silver:#A9B4DA; --silver-soft:#1A2246;
  --bronze:#C98A5A; --bronze-soft:#241a12; --clay:#E0752B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:Inter,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5; transition:background .25s ease,color .25s ease;}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

.hdr{position:sticky; top:0; z-index:40; background:linear-gradient(115deg,#123FD6 0%,#0522A6 100%);
  box-shadow:0 2px 10px rgba(5,34,166,.28); color:#fff;}
.hdr__in{max-width:1200px; margin:0 auto; padding:0 24px; height:64px; display:flex; align-items:center; gap:26px;}
.brand{display:flex; align-items:center; gap:11px; background:none; border:0; padding:0; cursor:pointer;}
.logo-chip{width:40px; height:40px; border-radius:10px; background:#fff; flex:none;
  display:flex; align-items:center; justify-content:center; padding:4px; box-shadow:0 1px 4px rgba(0,0,0,.18)}
.logo-chip img{width:100%; height:100%; object-fit:contain; display:block}
.logo-chip.fallback img{display:none}
.logo-chip.fallback::after{content:"VC"; color:var(--navy); font-weight:800; font-size:14px; letter-spacing:-.02em}
.word__name{font-size:18px; font-weight:800; color:#fff; letter-spacing:-.01em; display:block; line-height:1.05}
.word__name em{color:var(--brand-soft); font-style:normal}
.word__tag{display:block; font-size:9px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#A9C2F0; margin-top:3px}
.nav{flex:1; display:flex; align-items:center; gap:3px}
.nav button{padding:8px 13px; border-radius:8px; font-size:13.5px; font-weight:600;
  color:rgba(255,255,255,.72); background:none; border:0; display:flex; align-items:center; gap:7px}
.nav button:hover{color:#fff; background:rgba(255,255,255,.09)}
.nav button.on{color:#fff; background:rgba(255,255,255,.16); font-weight:700}
.nav .ico{width:15px; height:15px; display:inline-block}
.actions{display:flex; align-items:center; gap:9px; flex:none}
.iconbtn{width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.09); display:flex; align-items:center; justify-content:center; color:#fff}
.iconbtn:hover{background:rgba(255,255,255,.18)}
.modechip{display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.4); border-radius:999px;
  padding:6px 11px; font-size:11px; font-weight:700; color:#fff; letter-spacing:.03em}
.modechip .d{width:7px; height:7px; border-radius:50%; background:#D7F171}
.modechip.demo .d{background:#F2C94C}

.wrap{max-width:1200px; margin:0 auto; padding:26px 24px 96px}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:20px; flex-wrap:wrap}
.page-head h1{font-size:22px; font-weight:800; letter-spacing:-.02em; margin:0}
.page-head p{margin:4px 0 0; color:var(--ink-2); font-size:13.5px; max-width:640px}
.stamp{font-size:11px; color:var(--ink-3); font-weight:600; white-space:nowrap}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-h{padding:14px 17px 0; display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.card-h h3{margin:0; font-size:14px; font-weight:700; letter-spacing:-.01em}
.btn{border-radius:9px; padding:9px 15px; font-size:13px; font-weight:700; border:1px solid var(--line); background:var(--panel); color:var(--ink-2)}
.btn:hover{color:var(--ink); border-color:var(--ink-3)}
.btn.primary{background:var(--blue); border-color:var(--blue); color:#fff}
.btn.primary:hover{background:var(--navy); color:#fff}
.btn.primary:disabled{opacity:.5; cursor:not-allowed}
.btn.ghost{background:transparent}
.banner{display:flex; align-items:flex-start; gap:9px; background:var(--panel-2); border:1px solid var(--line);
  border-radius:10px; padding:11px 14px; font-size:12.5px; color:var(--ink-2); margin-bottom:18px}
.banner b{color:var(--ink)}

.groupsec{margin-bottom:24px}
.group-h{display:flex; align-items:center; gap:11px; margin:0 2px 12px}
.gtag{font-weight:800; font-size:15px; color:#fff; background:linear-gradient(135deg,var(--blue),var(--navy));
  width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center}
.group-h h3{margin:0; font-size:13px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); font-weight:800}
.group-h .meta{font-size:11.5px; color:var(--ink-3); margin-left:auto; font-weight:600}

.pote-badge{font-size:10px; font-weight:800; color:var(--ink-3); background:var(--panel-2); border:1px solid var(--line);
  border-radius:6px; padding:2px 6px; letter-spacing:.03em}

.gt{width:100%; border-collapse:collapse; font-size:13px}
.gt th,.gt td{padding:9px 12px; text-align:center; border-top:1px solid var(--line-2)}
.gt th{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:700; border-top:0; background:var(--panel-2)}
.gt td.l,.gt th.l{text-align:left}
.gt td.pos{color:var(--ink-3); font-weight:700; width:34px}
.gt td.name{font-weight:700}
.gt td.pp{font-weight:800; color:var(--blue)}
.gt tr.q1 td.pos{color:var(--gold)} .gt tr.q1{background:linear-gradient(90deg,rgba(200,135,26,.09),transparent)}
.gt tr.q2 td.pos{color:var(--silver)}
.gt tr.q3 td.pos{color:var(--bronze)}
.qbadge{font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:5px; text-transform:uppercase; letter-spacing:.04em; margin-left:6px}
.qbadge.ouro{background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold)}
.qbadge.prata{background:var(--silver-soft); color:var(--silver); border:1px solid var(--silver)}
.qbadge.consol{background:var(--bronze-soft); color:var(--bronze); border:1px solid var(--bronze)}
.qbadge.tbd{background:var(--panel-2); color:var(--ink-3); border:1px solid var(--line)}

.phasetabs{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:16px}
.phasetab{border:0; background:none; color:var(--ink-3); font-weight:700; font-size:13.5px; padding:11px 14px;
  white-space:nowrap; border-bottom:2px solid transparent}
.phasetab:hover{color:var(--ink)}
.phasetab.on{color:var(--blue); border-bottom-color:var(--blue)}
.round{margin-bottom:18px}
.round-h{display:flex; align-items:center; gap:9px; margin:0 2px 9px}
.round-h .t{font-size:15px; font-weight:800; letter-spacing:-.01em}
.round-h .lab{font-size:11px; color:var(--ink-3); font-weight:600}
.round-h .break{margin-left:auto; font-size:11px; font-weight:700; color:var(--wine); background:var(--panel-2);
  border:1px solid var(--line); border-radius:999px; padding:3px 10px}
.mgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:11px}
.match{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px 13px; box-shadow:var(--shadow)}
.match.empty{opacity:.5; box-shadow:none; border-style:dashed}
.m-top{display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:11px; color:var(--ink-3); font-weight:700}
.court{background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:2px 7px; letter-spacing:.02em}
.cdot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:middle}
.m-tier{margin-left:auto; font-weight:800; letter-spacing:.03em}
.m-tier.ouro{color:var(--gold)} .m-tier.prata{color:var(--silver)} .m-tier.consol{color:var(--bronze)} .m-tier.grupo{color:var(--ink-3)}
.m-row{display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; padding:5px 0}
.m-row .pl{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nadal-inp{font-size:14px; font-weight:700; border:0; border-bottom:1px dashed var(--gold); background:transparent; color:var(--ink); padding:3px 2px; width:100%}
.nadal-inp:focus{outline:0; border-bottom-color:var(--blue)}
.m-row .pl.tbd{color:var(--ink-3); font-style:italic; font-weight:600}
.m-row.win .pl{color:var(--green); font-weight:800}
.scorebox{width:46px; height:38px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
  border-radius:8px; text-align:center; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums}
.scorebox:focus{outline:2px solid var(--brand-soft); border-color:var(--blue)}
.m-vs{text-align:center; font-size:10px; color:var(--ink-3); font-weight:700; letter-spacing:.1em; margin:1px 0}

.bracket-wrap{overflow-x:auto; padding-bottom:8px}
.tier-h{display:flex; align-items:center; gap:10px; margin:6px 2px 14px}
.tier-h .t{font-size:17px; font-weight:800; letter-spacing:-.01em}
.tier-h .badge{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:999px}
.tier-h .badge.ouro{background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold)}
.tier-h .badge.prata{background:var(--silver-soft); color:var(--silver); border:1px solid var(--silver)}
.tier-h .badge.consol{background:var(--bronze-soft); color:var(--bronze); border:1px solid var(--bronze)}
.bracket{display:flex; gap:18px; align-items:stretch; min-width:min-content}
.bcol{display:flex; flex-direction:column; justify-content:space-around; gap:14px; min-width:230px}
.bcol-h{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); margin-bottom:2px; text-align:center}
.bmatch{background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
.bmatch .bm-h{font-size:10px; font-weight:700; color:var(--ink-3); padding:6px 11px 0; letter-spacing:.03em}
.brow{display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; padding:8px 11px}
.brow+.brow{border-top:1px solid var(--line-2)}
.brow .pl{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brow .pl.tbd{color:var(--ink-3); font-style:italic}
.brow.win .pl{color:var(--green); font-weight:800}
.brow .sb{width:40px; height:32px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
  border-radius:7px; text-align:center; font-size:15px; font-weight:800}
.champ{margin-top:10px; padding:13px; border-radius:11px; text-align:center; background:linear-gradient(135deg,var(--gold-soft),transparent); border:1px solid var(--gold)}
.champ.prata{background:linear-gradient(135deg,var(--silver-soft),transparent); border-color:var(--silver)}
.champ.consol{background:linear-gradient(135deg,var(--bronze-soft),transparent); border-color:var(--bronze)}
.champ .lbl{font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.champ .nm{font-size:18px; font-weight:800; margin-top:3px}
.champ .nm.tbd{color:var(--ink-3); font-style:italic; font-size:14px; font-weight:600}

.rules-hero{display:flex; align-items:center; gap:16px; color:#fff; border-radius:14px; padding:20px 22px; margin:2px 0 20px;
  background:linear-gradient(120deg,#123FD6,#0522A6)}
.rules-hero .rt{font-weight:800; font-size:21px; line-height:1.1}
.rules-hero .rs{color:rgba(255,255,255,.85); font-size:13px; font-weight:500; margin-top:5px; max-width:560px}
.rsec-h{font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); margin:24px 2px 12px}
.rules-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px}
.rule-card{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:15px 16px; box-shadow:var(--shadow)}
.rule-card .big{font-weight:800; font-size:26px; color:var(--blue)}
.rule-card.gold .big{color:var(--gold)} .rule-card.silver .big{color:var(--silver)} .rule-card.bronze .big{color:var(--bronze)}
.rule-card h4{font-weight:800; margin:4px 0 4px; font-size:14.5px}
.rule-card p{margin:0; color:var(--ink-2); font-size:12.5px; line-height:1.5}
.rtable{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:13px; overflow:hidden; font-size:13.5px; box-shadow:var(--shadow)}
.rtable th,.rtable td{padding:10px 13px; text-align:left; border-bottom:1px solid var(--line-2)}
.rtable th{background:var(--panel-2); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:800}
.rtable td b{color:var(--ink)}
.rtable tr:last-child td{border-bottom:0}
.rules-text{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:16px 18px; color:var(--ink-2); font-size:13.5px; line-height:1.85; box-shadow:var(--shadow)}
.rules-text b{color:var(--ink)}

.potes-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:18px}
.pote{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.pote-h{display:flex; align-items:center; gap:9px; padding:12px 14px; border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.pote-h .n{width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,var(--blue),var(--navy)); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center}
.pote-h .t{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2)}
.pote-h .pos{margin-left:auto; font-size:10.5px; color:var(--ink-3); font-weight:700}
.pote .inp{width:100%; border:0; border-top:1px solid var(--line-2); background:transparent; color:var(--ink); padding:9px 14px; font-size:13.5px; font-weight:600}
.pote .inp:focus{outline:0; background:var(--panel-2)}
.pote .inp.done{color:var(--ink); font-weight:700}
.draft-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
.stage{position:relative; background:linear-gradient(120deg,#0F1738,#0522A6); border-radius:16px; padding:30px 24px; text-align:center; color:#fff; overflow:hidden; min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 12px 40px rgba(5,34,166,.28)}
.stage .eyebrow{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--brand-soft)}
.stage .reveal-name{font-size:32px; font-weight:800; letter-spacing:-.02em; margin:8px 0 4px; min-height:40px; line-height:1.1}
.stage .reveal-name.cycling{color:#D7F171; opacity:.9}
.stage .reveal-dest{font-size:15px; font-weight:700; color:#fff; opacity:0; transition:opacity .3s}
.stage .reveal-dest.show{opacity:1}
.stage .reveal-dest .gtag2{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:8px; background:#D7F171; color:#0522A6; font-weight:800; margin-left:6px; vertical-align:middle}
.stage .progress{position:absolute; bottom:12px; left:0; right:0; font-size:11px; color:rgba(255,255,255,.6); font-weight:600}
.stage.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.98)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
.mini-groups{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-top:18px}
.mini-g{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:0; overflow:hidden; box-shadow:var(--shadow)}
.mini-g .mh{display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--panel-2); border-bottom:1px solid var(--line-2)}
.mini-g .mh .gtag{width:26px; height:26px; font-size:13px; border-radius:7px}
.mini-g .mh b{font-size:12px; font-weight:800}
.mini-g .slot{display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:13px; border-top:1px solid var(--line-2)}
.mini-g .slot:first-child{border-top:0}
.mini-g .slot .pl{font-weight:600}
.mini-g .slot .pl.tbd{color:var(--ink-3); font-style:italic; font-weight:500}
.mini-g .slot.just{animation:flash 1s ease}
@keyframes flash{0%{background:rgba(215,241,113,.5)}100%{background:transparent}}
.confetti-c{position:fixed; inset:0; pointer-events:none; z-index:80; overflow:hidden; display:none}
.confetti-c.go{display:block}
.conf{position:absolute; top:-20px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(680deg); opacity:.9}}
.toast{position:fixed; bottom:88px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg);
  padding:11px 18px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:90}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.seedcols{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; align-items:start}
.tiemark{display:inline-block; color:var(--wine); font-weight:800; margin-left:2px}
.tiebox{margin:10px 2px 0; padding:13px 15px; border:1px solid var(--gold); border-radius:11px; background:linear-gradient(120deg,var(--gold-soft),transparent)}
.tieh{font-size:13px; font-weight:800; color:var(--ink); margin-bottom:3px}
.tiesub{font-size:12px; color:var(--ink-2); margin-bottom:10px; line-height:1.45}
.tiechips{display:flex; flex-wrap:wrap; gap:8px}
.tiechip{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:9px; padding:8px 13px; font-size:13.5px; font-weight:600}
.tiechip:hover{border-color:var(--blue)}
.tiechip.set{border-color:var(--gold); background:var(--gold-soft)}
.tiechip .tiepos{font-weight:800; color:var(--gold); font-size:12px}
.tiebox.done{border-color:var(--green); background:linear-gradient(120deg,rgba(109,190,69,.12),transparent)}
.tiebox.done .tiechip.set{border-color:var(--green); background:rgba(109,190,69,.12)}
.tiebox.done .tiechip .tiepos{color:var(--green)}
.tiedone{font-size:11px; font-weight:800; color:var(--green)}
.lockchip{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800; color:var(--green); background:rgba(109,190,69,.12); border:1px solid var(--green); border-radius:999px; padding:8px 14px}
.foot{max-width:1200px; margin:0 auto; padding:8px 24px 40px; font-size:11px; color:var(--ink-3)}

@media (max-width:820px){ .bcol{min-width:200px} }
@media (max-width:760px){
  .hdr__in{gap:12px; padding:0 14px}
  .nav{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--panel); border-top:1px solid var(--line);
    justify-content:space-around; gap:0; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); box-shadow:0 -6px 18px rgba(9,26,84,.08)}

/* Inscritos por pote (1 = mais forte). 3 potes de 7 = 21 atletas. */
const ROSTER = {
  1:["Bruno Zaremba","Daniel Doine","Mateus Maia","Matheus Canale","Thomaz Hadba","Andre Nogueira","Ilan Nigri"],
  2:["Pedro Lopes","Leonardo Antunes","Tiago Timm","Felipe Hallot","Plinio Barbosa","Carlos Eduardo Martins","Gabriel Felzenszwalb"],

};

/* Sorteio OFICIAL já realizado e anunciado (P1, P2, P3 por grupo). É o padrão fixo do app. */
const FIXED_GROUPS = {
  A:["Ilan Nigri","Plinio Barbosa","Victor Hugo Borges"],
  B:["Andre Nogueira","Tiago Timm","Gustavo Castro"],
  C:["Daniel Doine","Pedro Lopes","Philip Medley"],
  D:["Mateus Maia","Carlos Eduardo Martins","Luis Guedes"],
  E:["Bruno Zaremba","Leonardo Antunes","Eike Rabelo"],
  F:["Matheus Canale","Felipe Hallot","Pedro Albuquerque"],
  G:["Thomaz Hadba","Gabriel Felzenszwalb","Gustavo Xavier"]
};
function cloneGroups(src){ const o={}; GROUPS.forEach(g=> o[g]=(src[g]||[null,null,null]).slice()); return o; }
function groupsComplete(gr){ try{ return GROUPS.every(g=> gr && gr[g] && gr[g].length===3 && gr[g].every(x=> x && String(x).trim())); }catch(e){ return false; } }
function normalizeGroups(){ if(!groupsComplete(S.groups)){ S.groups=cloneGroups(FIXED_GROUPS); S.drawDone=true; return true; } return false; }

function defaultState(){
  const potes={1:ROSTER[1].slice(),2:ROSTER[2].slice(),3:ROSTER[3].slice()};
  return { potes, groups:cloneGroups(FIXED_GROUPS), drawDone:true, groupsLocked:true, results:{}, finals:{}, tiebreaks:{}, nadal:{pa:"",pb:"",a:null,b:null} };
}
let S = defaultState();
let VIEW = "classificacao";
let PHASE = "grupos";

/* Potes são fixos: se algum pote vier vazio (ex.: limpeza antiga), restaura do ROSTER */
function normalizePotes(){
  if(!S.potes) S.potes={};
  let changed=false;
  for(let p=1;p<=3;p++){
    const arr=S.potes[p];
    const filled=Array.isArray(arr)? arr.filter(x=>x&&String(x).trim()).length : 0;
    if(filled===0){ S.potes[p]=ROSTER[p].slice(); changed=true; }
  }
  return changed;
}

/* ====================== PERSISTÊNCIA ====================== */
let DBH=null, LIVE=false;
let SYNC={ok:false, err:null};
function syncErr(e){ SYNC.err=(e&&(e.code||e.message))||"erro"; try{render();}catch(_){} }
function syncOk(){ if(SYNC.err||!SYNC.ok){ SYNC.ok=true; SYNC.err=null; try{render();}catch(_){} } }
function persistLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(S)); }catch(e){} }
function allGroupIds(){ const ids=[]; GROUPS.forEach(g=> groupPairs().forEach(([i,j])=> ids.push(mid(g,i,j)))); return ids; }
function saveResult(id){ persistLocal(); if(LIVE&&DBH){ DBH.collection(C_RES).doc(id).set(S.results[id]||{a:null,b:null}).then(syncOk).catch(syncErr); } }
function saveFinal(slot){ persistLocal(); if(LIVE&&DBH){ DBH.collection(C_FIN).doc(slot).set(S.finals[slot]||{a:null,b:null}).then(syncOk).catch(syncErr); } }
function saveConfig(){ persistLocal(); if(LIVE&&DBH){ DBH.collection(C_CFG).doc(D_CFG).set({potes:S.potes, groups:S.groups, drawDone:S.drawDone, groupsLocked:S.groupsLocked, tiebreaks:S.tiebreaks, nadal:S.nadal||{}}).then(syncOk).catch(syncErr); } }
function saveEverything(){
  persistLocal();
  if(LIVE&&DBH){
    saveConfig();
    allGroupIds().forEach(id=> DBH.collection(C_RES).doc(id).set(S.results[id]||{a:null,b:null}).then(syncOk).catch(syncErr));
    Object.keys(BRACKET).forEach(s=> DBH.collection(C_FIN).doc(s).set(S.finals[s]||{a:null,b:null}).then(syncOk).catch(syncErr));
  }
}
function initData(){
  try{ const raw=localStorage.getItem(LKEY); if(raw) S=Object.assign(defaultState(), JSON.parse(raw)); }catch(e){}
  if(normalizePotes()) persistLocal();
  if(normalizeGroups()) persistLocal();
  if(!DEMO && typeof firebase!=="undefined" && firebase.initializeApp){
    try{
      firebase.initializeApp(firebaseConfig);
      DBH=firebase.firestore(); LIVE=true;
      DBH.collection(C_CFG).doc(D_CFG).onSnapshot(d=>{
        syncOk();
        if(d.exists){ const c=d.data(); if(c.potes)S.potes=c.potes; if(c.groups && groupsComplete(c.groups)) S.groups=c.groups; S.groupsLocked=!!c.groupsLocked; S.tiebreaks=c.tiebreaks||{}; if(c.nadal)S.nadal=c.nadal; }
        let changed=normalizePotes(); if(normalizeGroups()) changed=true;
        S.drawDone=groupsComplete(S.groups);
        if(changed) saveConfig();
        render();
      }, syncErr);
      DBH.collection(C_RES).onSnapshot(s=>{ syncOk(); s.forEach(doc=> S.results[doc.id]=doc.data()); render(); }, syncErr);
      DBH.collection(C_FIN).onSnapshot(s=>{ syncOk(); s.forEach(doc=> S.finals[doc.id]=doc.data()); render(); }, syncErr);
    }catch(e){ LIVE=false; }
  }
  render();
}

/* ====================== HELPERS ====================== */
const $ = (s,el=document)=> el.querySelector(s);
function name(g,pos){ const v=S.groups[g] && S.groups[g][pos-1]; return v || (g+pos); }
function isNamed(g,pos){ return !!(S.groups[g] && S.groups[g][pos-1]); }
function mid(g,i,j){ return "G-"+g+"-"+i+"-"+j; }
function groupPairs(){ return [[1,2],[1,3],[2,3]]; }   // round-robin de 3

function computeGroup(g){
  const st={}; for(let p=1;p<=3;p++) st[p]={pos:p, name:name(g,p), w:0, gw:0, gl:0, played:0};
  groupPairs().forEach(([i,j])=>{
    const r=S.results[mid(g,i,j)];
    if(r && r.a!=null && r.b!=null && r.a!=="" && r.b!==""){
      const a=+r.a, b=+r.b;
      st[i].gw+=a; st[i].gl+=b; st[j].gw+=b; st[j].gl+=a; st[i].played++; st[j].played++;
      if(a>b) st[i].w++; else if(b>a) st[j].w++;
    }
  });
  Object.values(st).forEach(x=> x.saldo=x.gw-x.gl);
  const h2h=(x,y)=>{
    for(const [i,j] of groupPairs()){
      if((i===x&&j===y)||(i===y&&j===x)){
        const r=S.results[mid(g,Math.min(i,j),Math.max(i,j))];
        if(!r||r.a==null||r.b==null||r.a===""||r.b==="") return 0;
        const lo=Math.min(i,j), a=+r.a,b=+r.b;
        const winnerPos = a>b?lo:(b>a?Math.max(i,j):0);
        if(!winnerPos) return 0;
        return winnerPos===x?1:-1;
      }
    }
    return 0;
  };
  let arr=[1,2,3].sort((a,b)=> st[b].w-st[a].w);
  const out=[]; let k=0;
  while(k<arr.length){
    let m=k; while(m+1<arr.length && st[arr[m+1]].w===st[arr[k]].w) m++;
    let cl=arr.slice(k,m+1);
    if(cl.length===2){
      const hh=h2h(cl[0],cl[1]);
      if(hh!==0) cl = hh>0?[cl[0],cl[1]]:[cl[1],cl[0]];
      else cl.sort((a,b)=> st[b].saldo-st[a].saldo || st[a].gl-st[b].gl);
    } else if(cl.length>2){
      cl.sort((a,b)=> st[b].saldo-st[a].saldo || st[a].gl-st[b].gl);
      for(let z=0;z<cl.length-1;z++){
        if(st[cl[z]].saldo===st[cl[z+1]].saldo && st[cl[z]].gl===st[cl[z+1]].gl){
          if(h2h(cl[z],cl[z+1])<0){ const t=cl[z]; cl[z]=cl[z+1]; cl[z+1]=t; }
        }
      }
    }
    out.push(...cl); k=m+1;
  }
  const tieTag={}; let a=0;
  while(a<out.length){
    let b=a; while(b+1<out.length && st[out[b+1]].w===st[out[a]].w && st[out[b+1]].saldo===st[out[a]].saldo && st[out[b+1]].gl===st[out[a]].gl) b++;
    if(b-a>=2){
      const positions=out.slice(a,b+1);
      const key='g'+g+'|'+positions.slice().sort((x,y)=>x-y).join('');
      const order=(S.tiebreaks&&S.tiebreaks[key])||[];
      const seg=positions.slice().sort((x,y)=>{ const ix=order.indexOf(String(x)), iy=order.indexOf(String(y)); return (ix<0?99:ix)-(iy<0?99:iy); });
      for(let z=0;z<seg.length;z++) out[a+z]=seg[z];
      const resolved=positions.every(p=> order.includes(String(p)));
      positions.forEach(p=> tieTag[p]={key, members:positions.slice(), resolved});
    }
    a=b+1;
  }
  return out.map((pos,i)=> ({...st[pos], rank:i+1, tie: tieTag[pos]||null}));
}
function groupComplete(g){ return groupPairs().every(([i,j])=>{ const r=S.results[mid(g,i,j)]; return r&&r.a!=null&&r.b!=null&&r.a!==""&&r.b!==""; }); }
function allGroupsComplete(){ return GROUPS.every(groupComplete); }

/* Ranking entre grupos de quem terminou em determinada colocação (0=1º,1=2º,2=3º) */
function rankPlace(place){
  const arr = GROUPS.map(g=>{ const r=computeGroup(g); return {...r[place], g}; });
  arr.sort((x,y)=> y.w-x.w || y.saldo-x.saldo || x.gl-y.gl || x.g.localeCompare(y.g));
  let a=0;
  while(a<arr.length){
    let b=a; while(b+1<arr.length && arr[b+1].w===arr[a].w && arr[b+1].saldo===arr[a].saldo && arr[b+1].gl===arr[a].gl) b++;
    if(b-a>=1){
      const grps=arr.slice(a,b+1).map(r=>r.g);
      const key='p'+place+'|'+grps.slice().sort().join('');
      const order=(S.tiebreaks&&S.tiebreaks[key])||[];
      const seg=arr.slice(a,b+1).sort((x,y)=>{ const ix=order.indexOf(x.g), iy=order.indexOf(y.g); return (ix<0?99:ix)-(iy<0?99:iy); });
      const resolved=grps.every(gg=> order.includes(gg));
      for(let z=0;z<seg.length;z++){ seg[z]._tie={key, members:grps.slice(), resolved}; arr[a+z]=seg[z]; }
    }
    a=b+1;
  }
  return arr;
}

function buildSeeding(){
  const leaders=rankPlace(0), seconds=rankPlace(1), thirds=rankPlace(2);
  const gold=[null].concat(leaders.slice(0,7)); // 1..7 líderes
  gold[8]=seconds[0];                           // melhor 2º
  if(gold[8]&&gold[1]&&gold[8].g===gold[1].g){ const t=gold[7]; gold[7]=gold[8]; gold[8]=t; } // anti-reencontro
  const silver=[null].concat(seconds.slice(1,7)); // 1..6 (2º restantes)
  silver[7]=thirds[0]; silver[8]=thirds[1];       // 2 melhores 3º
  if(silver[8]&&silver[1]&&silver[8].g===silver[1].g){ const t=silver[7]; silver[7]=silver[8]; silver[8]=t; }
  const consol=[null].concat(thirds.slice(2,7));  // 1..5 (3º restantes)
  return {gold, silver, consol, leaders, seconds, thirds};
}
let _seedCache=null,_seedKey=null;
function seeding(){
  const key=JSON.stringify([S.results,S.tiebreaks]);
  if(_seedKey===key) return _seedCache;
  _seedKey=key; _seedCache = allGroupsComplete()? buildSeeding() : null;
  return _seedCache;
}

function resolveRef(ref){
  const sd=seeding();
  if(ref.oseed!=null) return sd? sd.gold[ref.oseed] : null;
  if(ref.pseed!=null) return sd? sd.silver[ref.pseed] : null;
  if(ref.cseed!=null) return sd? sd.consol[ref.cseed] : null;
  if(ref.win!=null) return winnerOf(ref.win);
  if(ref.lose!=null) return loserOf(ref.lose);
  return null;
}
function bracketPlayers(slot){ const b=BRACKET[slot]; return { a:resolveRef(b.a), b:resolveRef(b.b) }; }
function winnerOf(slot){
  const p=bracketPlayers(slot), r=S.finals[slot];
  if(!p.a||!p.b||!r||r.a==null||r.b==null||r.a===""||r.b===""||+r.a===+r.b) return null;
  return (+r.a>+r.b)? p.a : p.b;
}
function loserOf(slot){
  const p=bracketPlayers(slot), r=S.finals[slot];
  if(!p.a||!p.b||!r||r.a==null||r.b==null||r.a===""||r.b===""||+r.a===+r.b) return null;
  return (+r.a>+r.b)? p.b : p.a;
}
function pname(pl){ return pl? (pl.name || (pl.g+(pl.rank||""))) : null; }

const OSEED_LABEL={1:"1º líder",2:"2º líder",3:"3º líder",4:"4º líder",5:"5º líder",6:"6º líder",7:"7º líder",8:"Melhor 2º"};
const PSEED_LABEL={1:"2º colocado",2:"2º colocado",3:"2º colocado",4:"2º colocado",5:"2º colocado",6:"2º colocado",7:"Melhor 3º",8:"2º melhor 3º"};
const CSEED_LABEL={1:"3º (1)",2:"3º (2)",3:"3º (3)",4:"3º (4)",5:"3º (5)"};
const SLOT_SHORT={OQF1:"QF1",OQF2:"QF2",OQF3:"QF3",OQF4:"QF4",OSF1:"Semi 1",OSF2:"Semi 2",
  PQF1:"QF1",PQF2:"QF2",PQF3:"QF3",PQF4:"QF4",PSF1:"Semi 1",PSF2:"Semi 2",
  CPI:"Repescagem",CSF1:"Semi 1",CSF2:"Semi 2"};
function refLabel(ref){
  if(!ref) return "a definir";
  if(ref.oseed!=null) return OSEED_LABEL[ref.oseed]||("Cabeça "+ref.oseed);
  if(ref.pseed!=null) return PSEED_LABEL[ref.pseed]||("Prata "+ref.pseed);
  if(ref.cseed!=null) return CSEED_LABEL[ref.cseed]||("Consol "+ref.cseed);
  if(ref.win!=null) return "Vencedor "+(SLOT_SHORT[ref.win]||ref.win);
  if(ref.lose!=null) return "Perdedor "+(SLOT_SHORT[ref.lose]||ref.lose);
  return "a definir";
}

function destBadge(g,pos){
  const sd=buildSeeding();
  const inGold = sd.gold.slice(1).some(p=>p&&p.g===g&&p.pos===pos);
  const inSil  = sd.silver.slice(1).some(p=>p&&p.g===g&&p.pos===pos);
  const inCon  = sd.consol.slice(1).some(p=>p&&p.g===g&&p.pos===pos);
  if(inGold) return `<span class="qbadge ouro">Ouro</span>`;
  if(inSil)  return `<span class="qbadge prata">Prata</span>`;
  if(inCon)  return `<span class="qbadge consol">Consolação</span>`;
  return "";
}

      <div class="bcol"><div class="bcol-h">Final</div>${bmatch("OF")}
        <div class="champ"><div class="lbl">Campeão Ouro</div><div class="nm ${oC?'':'tbd'}">${oC?pname(oC):'a definir'}</div></div></div>
    </div></div>`;
  const prata=`<div class="tier-h" style="margin-top:26px"><span class="t">Chave Prata</span><span class="badge prata">8 atletas · quartas</span></div>
    <div class="bracket-wrap"><div class="bracket">
      <div class="bcol"><div class="bcol-h">Quartas</div>${bmatch("PQF1")}${bmatch("PQF2")}${bmatch("PQF3")}${bmatch("PQF4")}</div>
      <div class="bcol"><div class="bcol-h">Semifinais</div>${bmatch("PSF1")}${bmatch("PSF2")}</div>
      <div class="bcol"><div class="bcol-h">Final</div>${bmatch("PF")}
        <div class="champ prata"><div class="lbl">Campeão Prata</div><div class="nm ${pC?'':'tbd'}">${pC?pname(pC):'a definir'}</div></div></div>
    </div></div>`;
  const consol=`<div class="tier-h" style="margin-top:26px"><span class="t">Troféu Consolação</span><span class="badge consol">5 atletas · repescagem</span></div>
    <div class="bracket-wrap"><div class="bracket">
      <div class="bcol"><div class="bcol-h">Repescagem</div>${bmatch("CPI")}</div>
      <div class="bcol"><div class="bcol-h">Semifinais</div>${bmatch("CSF1")}${bmatch("CSF2")}</div>
      <div class="bcol"><div class="bcol-h">Final</div>${bmatch("CF")}
        <div class="champ consol"><div class="lbl">Campeão Consolação</div><div class="nm ${cC?'':'tbd'}">${cC?pname(cC):'a definir'}</div></div></div>
    </div></div>`;
  return `<div class="page-head"><div><h1>Chaves</h1><p>Mata-mata. Ouro e Prata em sets convencionais; Consolação em sets de 4 games. Vencedores avançam sozinhos conforme os placares entram.</p></div>
    <div class="stamp">QF 1×8 · 4×5 · 3×6 · 2×7</div></div>${gate}${ouro}${prata}${consol}`;
}

/* ====================== REGRAS ====================== */
function renderRegras(){
  return `<div class="rules-hero"><div><div class="rt">Regulamento</div>
    <div class="rs">21 atletas, 3 potes, 7 grupos de 3. Grupos em sets de 4 games (no-ad); fases finais em sets convencionais. Três chaves: Ouro, Prata e Consolação.</div></div></div>

    <div class="rsec-h">Formato</div>
    <div class="rules-grid">
      <div class="rule-card"><div class="big">7×3</div><h4>Grupos</h4><p>Sete grupos de três, todos contra todos. Cada atleta joga 2 partidas na fase de grupos.</p></div>
      <div class="rule-card"><div class="big">4</div><h4>Set curto (grupos)</h4><p>Set de 4 games, no-ad. ~30 min por jogo. 21 jogos das 10h às 13h.</p></div>
      <div class="rule-card gold"><div class="big">8</div><h4>Chave Ouro</h4><p>7 líderes de grupo + o melhor 2º colocado. Começa nas quartas.</p></div>
      <div class="rule-card silver"><div class="big">8</div><h4>Chave Prata</h4><p>Os outros 6 segundos + os 2 melhores terceiros. Começa nas quartas.</p></div>
      <div class="rule-card bronze"><div class="big">5</div><h4>Consolação</h4><p>Os 5 terceiros restantes. Repescagem, semifinais e final, em sets de 4 games.</p></div>
    </div>

    <div class="rsec-h">Classificação — critérios de desempate</div>
    <table class="rtable"><thead><tr><th style="width:34px">#</th><th>Critério</th><th>Observação</th></tr></thead>
      <tbody>
        <tr><td><b>1</b></td><td>Número de vitórias</td><td>Partidas ganhas nos 2 jogos do grupo.</td></tr>
        <tr><td><b>2</b></td><td>Confronto direto (empate de 2)</td><td>Quem venceu o jogo entre os dois.</td></tr>
        <tr><td><b>3</b></td><td>Saldo de games</td><td>Games ganhos − games perdidos no grupo.</td></tr>
        <tr><td><b>4</b></td><td>Menor nº de games perdidos</td><td>Equivale a maior % de games ganhos.</td></tr>
        <tr><td><b>5</b></td><td>Tie-break decisivo na quadra</td><td>Persistindo o empate (inclusive triplo, comum em grupo de 3), joga-se um tie-break. O organizador registra a ordem na Classificação e ela é aplicada sozinha.</td></tr>
      </tbody></table>

    <div class="rsec-h">Avanço e chaveamento</div>
    <div class="rules-text">
      Todos avançam após os grupos. Os <b>7 líderes</b> e o <b>melhor 2º</b> formam a <b>Chave Ouro</b> (8, quartas). Os <b>outros 6 segundos</b> e os <b>2 melhores terceiros</b> formam a <b>Chave Prata</b> (8, quartas). Os <b>5 terceiros restantes</b> disputam o <b>Troféu Consolação</b>.<br>
      Para eleger o melhor 2º, os 2 melhores 3º e ordenar os cabeças, compara-se entre grupos por <b>vitórias → saldo de games → games perdidos</b> (todos jogaram 2 partidas).<br>
      Quartas (Ouro e Prata): <b>1×8, 4×5, 3×6, 2×7</b>. Regra anti-reencontro: se o melhor 2º cairia contra o líder do próprio grupo, invertem-se os cabeças 7 e 8.
    </div>

    <div class="rsec-h">Quadras e agenda</div>
    <div class="rules-text">
      Quadras: <b>Saibro 1, Saibro 2, Rápida 1 e Rápida 2</b> o dia todo; a <b>Saibro Coberta</b> entra só a partir das <b>12h00</b>. Na grade: <span class="cdot" style="background:var(--clay)"></span> saibro (laranja) e <span class="cdot" style="background:var(--blue)"></span> rápida (azul).<br>
      Como só há <b>3 quadras de saibro</b> (Saibro 1, Saibro 2 e Coberta), das 4 QFs do Ouro <b>3 ficam no saibro</b> e 1 na rápida; semis e final do Ouro seguem no saibro. A Consolação usa a rápida.<br>
      <b>Sets:</b> fase de grupos em 4 games; mata-mata em set convencional; a <b>repescagem da Consolação (CPI)</b> é a única do mata-mata em 4 games.<br>
      <b>10h00–13h00</b> — fase de grupos. Ondas das 12h00/12h30 na Saibro 2, Saibro Coberta, Rápida 1 e Rápida 2 (a Saibro 1 fica com a Taça Nadal).<br>
      <b>12h00–14h00</b> — <b>Taça Rafael Nadal</b>, exibição de ~2h na Saibro 1, dentro do bloco de grupos.<br>
      <b>13h00–17h00</b> — mata-mata, começando logo após o último jogo de grupos (sem pausa longa). Das 13h às 14h a 1ª onda roda em 4 quadras porque a Saibro 1 ainda está com a Nadal; a partir das 14h entram as 5. QFs Prata (13h00), QFs Ouro + repescagem (14h00), semifinais (14h45), Consolação 2×3 (15h30) e <b>todas as finais às 16h15</b>, com ~45 min de descanso entre semifinal e final.
    </div>`;
}

/* ====================== SORTEIO ====================== */
let draftPlan=null, draftIdx=0, draftAnimating=false;
function renderSorteio(){
  const potesHtml=[1,2,3].map(p=>{
    const filled=S.potes[p].filter(x=>x&&x.trim()).length;
    const inputs=S.potes[p].map((nm,i)=>`<input class="inp ${S.drawDone?'done':''}" ${S.drawDone?'disabled':''} placeholder="Atleta ${i+1}" value="${(nm||'').replace(/"/g,'&quot;')}" onchange="setPote(${p},${i},this.value)">`).join("");
    return `<div class="pote"><div class="pote-h"><span class="n">${p}</span><span class="t">Pote ${p}</span><span class="pos">→ posição ${p} · ${filled}/7</span></div>${inputs}</div>`;
  }).join("");
  const total=[1,2,3].reduce((a,p)=>a+S.potes[p].filter(x=>x&&x.trim()).length,0);
  const ready=[1,2,3].every(p=>S.potes[p].filter(x=>x&&x.trim()).length===7);

  const stage=`<div class="stage" id="stage">
      <div class="eyebrow">${S.drawDone?'Sorteio concluído':'Sorteio dos grupos'}</div>
      <div class="reveal-name" id="revealName">${S.drawDone?'🎾 Grupos definidos':'Pronto para sortear'}</div>
      <div class="reveal-dest ${S.drawDone?'show':''}" id="revealDest">${S.drawDone?'Um atleta de cada pote por grupo':''}</div>
      <div class="progress" id="revealProg">${total}/21 atletas cadastrados</div>
    </div>`;
  const mini=`<div class="mini-groups">`+GROUPS.map(g=>{
    const slots=[1,2,3].map(pos=>{ const nm=S.groups[g][pos-1];
      return `<div class="slot" data-g="${g}" data-pos="${pos}"><span class="pote-badge">P${pos}</span><span class="pl ${nm?'':'tbd'}">${nm||('· '+g+pos)}</span></div>`; }).join("");
    return `<div class="mini-g"><div class="mh"><span class="gtag">${g}</span><b>Grupo ${g}</b></div>${slots}</div>`;
  }).join("")+`</div>`;

  const bar = S.drawDone
    ? (S.groupsLocked
        ? `<div class="draft-bar"><span class="lockchip">🔒 Grupos travados</span>
            <button class="btn ghost" onclick="toggleLock()">🔓 Destravar</button>
            <span style="font-size:12.5px;color:var(--ink-3)">Sorteio protegido.</span></div>`
        : `<div class="draft-bar"><button class="btn primary" onclick="toggleLock()">🔒 Travar grupos</button>
            <button class="btn ghost" onclick="redoDraw()">↺ Refazer sorteio</button>
            <span style="font-size:12.5px;color:var(--ink-3)">Refazer sorteio mantém os potes intactos.</span></div>`)
    : `<div class="draft-bar">
        <button class="btn primary" id="btnNext" ${ready?'':'disabled'} onclick="draftNext()">🎲 Sortear próximo</button>
        <button class="btn" id="btnAuto" ${ready?'':'disabled'} onclick="draftAll()">⏩ Sortear tudo</button>
        <button class="btn ghost" onclick="loadRoster()">↻ Restaurar potes</button>
        ${ready?'':'<span style="font-size:12.5px;color:var(--ink-3)">Preencha 7 nomes em cada pote para liberar o sorteio.</span>'}
      </div>`;

  return `<div class="page-head"><div><h1>Sorteio</h1><p>Sorteia-se o pote 1 nos grupos A–G, depois o pote 2, depois o pote 3. Cada grupo recebe 1 atleta de cada pote (posição = pote).</p></div>
    <div class="stamp">3 potes × 7 · 1 por pote por grupo</div></div>
    ${bar}${stage}<div class="rsec-h">Grupos</div>${mini}
    ${ S.drawDone?'' : '<div class="rsec-h">Potes</div><div class="potes-grid">'+potesHtml+'</div>'}`;
}
function setPote(p,i,v){ if(S.groupsLocked) return; S.potes[p][i]=v.trim(); saveConfig(); render(); }
function loadRoster(){ S.potes=JSON.parse(JSON.stringify(ROSTER)); saveConfig(); render(); toast("Inscritos carregados nos potes."); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildPlan(){ const plan=[]; for(let p=1;p<=3;p++){ const names=shuffle(S.potes[p].slice()); GROUPS.forEach((g,idx)=> plan.push({pote:p,name:names[idx],group:g})); } return plan; }
function ensurePlan(){ if(!draftPlan){ draftPlan=buildPlan(); draftIdx=0; } }
function commitReveal(item){
  S.groups[item.group][item.pote-1]=item.name;
  const stage=$("#stage"); if(stage) stage.classList.add("pop");
  saveConfig();
  const slot=document.querySelector(`.mini-g .slot[data-g="${item.group}"][data-pos="${item.pote}"]`);
  if(slot){ slot.classList.add("just"); const pl=slot.querySelector(".pl"); pl.textContent=item.name; pl.classList.remove("tbd"); }
}
function draftNext(cb){
  if(S.groupsLocked||draftAnimating) return;
  ensurePlan();
  if(draftIdx>=draftPlan.length){ finishDraw(); if(cb)cb(); return; }
  const item=draftPlan[draftIdx];
  const nameEl=$("#revealName"), destEl=$("#revealDest"), progEl=$("#revealProg");
  if(!nameEl||!destEl||!progEl){ if(cb)cb(); return; }
  draftAnimating=true;
  const btnN=$("#btnNext"), btnA=$("#btnAuto"); if(btnN)btnN.disabled=true; if(btnA)btnA.disabled=true;
  destEl.classList.remove("show"); nameEl.classList.add("cycling");
  const pool=draftPlan.filter(x=>x.pote===item.pote).map(x=>x.name);
  let ticks=0; const maxT=16;
  const spin=setInterval(()=>{
    nameEl.textContent=pool[Math.floor(Math.random()*pool.length)]; ticks++;
    if(ticks>=maxT){
      clearInterval(spin); nameEl.classList.remove("cycling"); nameEl.textContent=item.name;
      destEl.innerHTML=`<b>Pote ${item.pote}</b> · Grupo <span class="gtag2">${item.group}</span>`;
      destEl.classList.add("show"); commitReveal(item); draftIdx++;
      progEl.textContent=`${draftIdx}/21 sorteados`;
      setTimeout(()=>{ draftAnimating=false; if(btnN)btnN.disabled=false; if(btnA)btnA.disabled=false;
        if(draftIdx>=draftPlan.length) finishDraw(); if(cb)cb(); }, 420);
    }
  }, 55);
}
function draftAll(){ if(S.groupsLocked) return; ensurePlan(); while(draftIdx<draftPlan.length){ const it=draftPlan[draftIdx]; S.groups[it.group][it.pote-1]=it.name; draftIdx++; } finishDraw(); }
function finishDraw(){
  if(S.drawDone) return;
  S.drawDone=true; saveConfig();
  const nameEl=$("#revealName"), destEl=$("#revealDest");
  if(nameEl) nameEl.textContent="🏆 Grupos definidos!";
  if(destEl){ destEl.innerHTML="Boa sorte a todos"; destEl.classList.add("show"); }
  confetti();
  setTimeout(()=>{ toast("Sorteio concluído! Nomes aplicados em todo o torneio."); render(); }, 1200);
}
function toggleLock(){
  if(S.groupsLocked){ if(!askCode()) return; S.groupsLocked=false; saveConfig(); render(); toast("Grupos destravados."); }
  else { S.groupsLocked=true; saveConfig(); render(); toast("Grupos travados 🔒"); }
}
function resetScores(){
  if(!askCode()) return;
  if(!confirm("Zerar APENAS os placares (grupos e finais)? Grupos, potes e nomes são mantidos.")) return;
  S.results={}; S.finals={}; S.tiebreaks={}; saveEverything(); render(); toast("Placares zerados.");
}
function resetSorteio(){
  if(S.groupsLocked){ toast("Grupos travados — destrave primeiro."); return; }
  if(!askCode()) return;
  if(!confirm("Limpar o sorteio? Apaga a alocação dos grupos e permite sortear de novo. Os potes e os placares são mantidos.")) return;
  GROUPS.forEach(g=> S.groups[g]=[null,null,null]);
  S.drawDone=false; draftPlan=null; draftIdx=0; normalizePotes(); saveConfig(); render(); toast("Sorteio limpo — potes mantidos.");
}
function redoDraw(){
  if(S.groupsLocked){ toast("Grupos travados — destrave primeiro."); return; }
  if(!askCode()) return;
  if(!confirm("Refazer o sorteio? Limpa a alocação atual (nomes dos potes são mantidos).")) return;
  GROUPS.forEach(g=> S.groups[g]=[null,null,null]);
  S.drawDone=false; draftPlan=null; draftIdx=0; saveConfig(); render();
}
function confetti(){
  const c=$("#confetti"); c.innerHTML=""; c.classList.add("go");
  const cols=["#123FD6","#00AEEF","#6DBE45","#C8871A","#D7F171","#2FA98E"];
  for(let i=0;i<90;i++){ const d=document.createElement("div"); d.className="conf";
    d.style.left=Math.random()*100+"%"; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.6+Math.random()*1.6)+"s"; d.style.animationDelay=(Math.random()*.5)+"s"; c.appendChild(d); }
  setTimeout(()=>{ c.classList.remove("go"); c.innerHTML=""; }, 3600);
}

/* ====================== PLACAR / TIE-BREAK ====================== */
function setScore(kind,id,side,val){
  const v=val.trim()===""?null:Math.max(0,Math.min(20,parseInt(val,10)||0));
  if(kind==="group"){ if(!S.results[id]) S.results[id]={a:null,b:null}; S.results[id][side]=v; saveResult(id); }
  else if(kind==="final"){ if(!S.finals[id]) S.finals[id]={a:null,b:null}; S.finals[id][side]=v; saveFinal(id); }
  else if(kind==="nadal"){ if(!S.nadal) S.nadal={pa:"",pb:"",a:null,b:null}; S.nadal[side]=v; saveConfig(); }
  render();
}
function tiePanel(title,key,members){
  const order=(S.tiebreaks&&S.tiebreaks[key])||[];
  const resolved=members.length && members.every(m=> order.includes(m.id));
  const chips=members.map(m=>{ const pos=order.indexOf(m.id);
    return `<button class="tiechip ${pos>=0?'set':''}" onclick="pickTie('${key}','${m.id}')">${pos>=0?`<span class="tiepos">${pos+1}º</span>`:''}${m.label}</button>`; }).join("");
  return `<div class="tiebox ${resolved?'done':''}">
    <div class="tieh">⚖ Tie-break — ${title} ${resolved?'<span class="tiedone">✓ definido</span>':'<span style="color:var(--wine);font-weight:800">a definir</span>'}</div>
    <div class="tiesub">${resolved?'Ordem registrada. Clique num nome para desmarcá-lo e reordenar, ou use Limpar desempate.':'Empate nos critérios. Jogue o tie-break e clique nos atletas na <b>ordem do resultado</b> (1º clique = melhor colocado).'}</div>
    <div class="tiechips">${chips}</div>
    <button class="btn ghost" style="margin-top:9px;color:var(--wine);padding:6px 12px" onclick="clearTie('${key}')">Limpar desempate</button></div>`;
}
function pickTie(key,id){
  const arr=(S.tiebreaks[key]||[]).slice(); const i=arr.indexOf(id);
  if(i>=0) arr.splice(i,1); else arr.push(id);
  if(arr.length) S.tiebreaks[key]=arr; else delete S.tiebreaks[key];
  saveConfig(); render();
}
function clearTie(key){ delete S.tiebreaks[key]; saveConfig(); render(); }
function askCode(){ const c=prompt("Código do organizador para confirmar:"); if(c===null) return false; if(c.trim()!==ADMIN_CODE){ toast("Código incorreto."); return false; } return true; }

/* ====================== MENU / EXPORT / TEMA ====================== */
function toggleTheme(){ const el=document.documentElement, cur=el.dataset.theme;
  if(cur==="dark"){ delete el.dataset.theme; try{localStorage.setItem("tt_theme","light")}catch(e){} }
  else { el.dataset.theme="dark"; try{localStorage.setItem("tt_theme","dark")}catch(e){} } }
function toggleMenu(e){ e.stopPropagation(); const m=$("#menu"); m.style.display=m.style.display==="none"?"block":"none"; }
document.addEventListener("click",()=>{ const m=$("#menu"); if(m) m.style.display="none"; });
function doExport(){ const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="vinci-open.json"; a.click(); toast("Estado exportado."); }
function doImport(ev){ const f=ev.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ S=Object.assign(defaultState(), JSON.parse(r.result)); saveEverything(); render(); toast("Estado importado."); }catch(e){ toast("Arquivo inválido."); } };
  r.readAsText(f); ev.target.value=""; }
function doReset(){
  if(S.groupsLocked){ toast("Grupos travados — destrave para zerar tudo."); return; }
  if(!askCode()) return;
  if(!confirm("Zerar TUDO (potes, grupos e placares)? Não dá para desfazer.")) return;
  S=defaultState(); draftPlan=null; draftIdx=0; saveEverything(); render(); toast("Torneio zerado."); }
function doResync(){
  if(DEMO){ toast("Modo demo — sem Firebase."); return; }
  if(!LIVE||!DBH){ toast("Firebase não conectou neste navegador."); return; }
  if(!askCode()) return;
  SYNC.err=null; saveEverything();
  setTimeout(()=>{ toast(SYNC.err? ("Falha ao publicar: "+SYNC.err) : "Dados republicados no Firebase."); render(); }, 900);
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2400); }

/* ====================== INIT ====================== */
initData();
</script>
</body>
