<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#123FD6" />
<title>Vinci Compass Open</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- tema antes de pintar -->
<script>try{if(localStorage.getItem("tt_theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>

<!-- Firebase (compat) — mesmo padrão do Broslao -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
/* ============================================================
   Tokens — paleta institucional (referência RadarPE) + acentos esportivos
   ============================================================ */
:root{
  --navy:#0522A6; --blue:#123FD6; --blue-2:#1560E0; --cyan:#00AEEF;
  --teal:#2FA98E; --green:#6DBE45; --wine:#8E3A63;
  --gold:#C8871A; --gold-soft:#F5E9CF; --silver:#8390B4; --silver-soft:#E9ECF5;
  --up:#2FA98E; --down:#8E3A63; --flat:#8C97B8; --live:#D2544E;

  --bg:#F5F7FB; --panel:#FFFFFF; --panel-2:#FBFCFE;
  --ink:#12204A; --ink-2:#4A567C; --ink-3:#8390B4;
  --line:#E4E9F4; --line-2:#EEF1F8; --brand-soft:#7FB0F2;

  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(9,26,84,.06), 0 8px 24px rgba(9,26,84,.05);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#070D24; --panel:#0F1738; --panel-2:#0C1330;
  --ink:#EAEEFB; --ink-2:#A9B4DA; --ink-3:#6E7AA6;
  --line:#1E2853; --line-2:#182146; --brand-soft:#7FB0F2;
  --gold:#E0A526; --gold-soft:#33291020; --silver:#A9B4DA; --silver-soft:#1A2246;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Inter,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5;
  transition:background .25s ease,color .25s ease;
}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* ============================================================ HEADER (RadarPE) */
.hdr{position:sticky; top:0; z-index:40;
  background:linear-gradient(115deg,#123FD6 0%,#0522A6 100%);
  box-shadow:0 2px 10px rgba(5,34,166,.28); color:#fff;}
.hdr__in{max-width:1200px; margin:0 auto; padding:0 24px; height:64px; display:flex; align-items:center; gap:26px;}
.brand{display:flex; align-items:center; gap:11px; background:none; border:0; padding:0; cursor:pointer;}
.logo-chip{width:40px; height:40px; border-radius:10px; background:#fff; flex:none;
  display:flex; align-items:center; justify-content:center; padding:4px; box-shadow:0 1px 4px rgba(0,0,0,.18)}
.logo-chip img{width:100%; height:100%; object-fit:contain; display:block}
.logo-chip.fallback img{display:none}
.logo-chip.fallback::after{content:"VC"; color:var(--navy); font-weight:800; font-size:14px; letter-spacing:-.02em}
.word__name{font-size:18px; font-weight:800; color:#fff; letter-spacing:-.01em; display:block; line-height:1.05}
.word__name em{color:var(--brand-soft); font-style:normal}
.word__tag{display:block; font-size:9px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#A9C2F0; margin-top:3px}
.nav{flex:1; display:flex; align-items:center; gap:3px}
.nav button{padding:8px 13px; border-radius:8px; font-size:13.5px; font-weight:600;
  color:rgba(255,255,255,.72); background:none; border:0; display:flex; align-items:center; gap:7px}
.nav button:hover{color:#fff; background:rgba(255,255,255,.09)}
.nav button.on{color:#fff; background:rgba(255,255,255,.16); font-weight:700}
.nav .ico{width:15px; height:15px; display:inline-block}
.actions{display:flex; align-items:center; gap:9px; flex:none}
.iconbtn{width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.09); display:flex; align-items:center; justify-content:center; color:#fff}
.iconbtn:hover{background:rgba(255,255,255,.18)}
.modechip{display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.4); border-radius:999px;
  padding:6px 11px; font-size:11px; font-weight:700; color:#fff; letter-spacing:.03em}
.modechip .d{width:7px; height:7px; border-radius:50%; background:#D7F171}
.modechip.demo .d{background:#F2C94C}

/* ============================================================ LAYOUT */
.wrap{max-width:1200px; margin:0 auto; padding:26px 24px 96px}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:20px; flex-wrap:wrap}
.page-head h1{font-size:22px; font-weight:800; letter-spacing:-.02em; margin:0}
.page-head p{margin:4px 0 0; color:var(--ink-2); font-size:13.5px; max-width:640px}
.stamp{font-size:11px; color:var(--ink-3); font-weight:600; white-space:nowrap}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-h{padding:14px 17px 0; display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.card-h h3{margin:0; font-size:14px; font-weight:700; letter-spacing:-.01em}
.src{font-size:10.5px; color:var(--ink-3); font-weight:600}
.btn{border-radius:9px; padding:9px 15px; font-size:13px; font-weight:700; border:1px solid var(--line); background:var(--panel); color:var(--ink-2)}
.btn:hover{color:var(--ink); border-color:var(--ink-3)}
.btn.primary{background:var(--blue); border-color:var(--blue); color:#fff}
.btn.primary:hover{background:var(--navy); color:#fff}
.btn.primary:disabled{opacity:.5; cursor:not-allowed}
.btn.ghost{background:transparent}
.banner{display:flex; align-items:flex-start; gap:9px; background:var(--panel-2); border:1px solid var(--line);
  border-radius:10px; padding:11px 14px; font-size:12.5px; color:var(--ink-2); margin-bottom:18px}
.banner b{color:var(--ink)}

/* ============================================================ GRUPOS/SECOES */
.groupsec{margin-bottom:24px}
.group-h{display:flex; align-items:center; gap:11px; margin:0 2px 12px}
.gtag{font-weight:800; font-size:15px; color:#fff; background:linear-gradient(135deg,var(--blue),var(--navy));
  width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center}
.group-h h3{margin:0; font-size:13px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); font-weight:800}
.group-h .meta{font-size:11.5px; color:var(--ink-3); margin-left:auto; font-weight:600}
.pote-badge{font-size:10px; font-weight:800; color:var(--ink-3); background:var(--panel-2); border:1px solid var(--line);
  border-radius:6px; padding:2px 6px; letter-spacing:.03em}

/* ============================================================ CLASSIFICAÇÃO */
.gt{width:100%; border-collapse:collapse; font-size:13px}
.gt th,.gt td{padding:9px 12px; text-align:center; border-top:1px solid var(--line-2)}
.gt th{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:700; border-top:0; background:var(--panel-2)}
.gt td.l,.gt th.l{text-align:left}
.gt td.pos{color:var(--ink-3); font-weight:700; width:34px}
.gt td.name{font-weight:700}
.gt td.pp{font-weight:800; color:var(--blue)}
.gt tr.q1 td.pos{color:var(--gold)} .gt tr.q1{background:linear-gradient(90deg,rgba(200,135,26,.09),transparent)}
.gt tr.q2 td.pos{color:var(--silver)} .gt tr.q2{background:linear-gradient(90deg,rgba(131,144,180,.08),transparent)}
.qbadge{font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:5px; text-transform:uppercase; letter-spacing:.04em; margin-left:6px}
.qbadge.ouro{background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold)}
.qbadge.prata{background:var(--silver-soft); color:var(--silver); border:1px solid var(--silver)}
.qbadge.out{background:var(--panel-2); color:var(--ink-3); border:1px solid var(--line)}
.qbadge.tbd{background:var(--panel-2); color:var(--ink-3); border:1px solid var(--line)}

/* ============================================================ JOGOS / SCHEDULE */
.phasetabs{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:16px}
.phasetab{border:0; background:none; color:var(--ink-3); font-weight:700; font-size:13.5px; padding:11px 14px;
  white-space:nowrap; border-bottom:2px solid transparent}
.phasetab:hover{color:var(--ink)}
.phasetab.on{color:var(--blue); border-bottom-color:var(--blue)}
.round{margin-bottom:18px}
.round-h{display:flex; align-items:center; gap:9px; margin:0 2px 9px}
.round-h .t{font-size:15px; font-weight:800; letter-spacing:-.01em}
.round-h .lab{font-size:11px; color:var(--ink-3); font-weight:600}
.round-h .break{margin-left:auto; font-size:11px; font-weight:700; color:var(--wine); background:var(--panel-2);
  border:1px solid var(--line); border-radius:999px; padding:3px 10px}
.mgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:11px}
.match{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px 13px; box-shadow:var(--shadow)}
.match.nadal{background:linear-gradient(120deg,rgba(200,135,26,.10),rgba(18,63,214,.05)); border-color:var(--gold)}
.match.empty{opacity:.5; box-shadow:none; border-style:dashed}
.m-top{display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:11px; color:var(--ink-3); font-weight:700}
.court{background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:2px 7px; letter-spacing:.02em}
.court.saibro{background:rgba(200,135,26,.10); border-color:var(--gold); color:var(--gold)}
.court.rapida{background:rgba(0,174,239,.10); border-color:var(--cyan); color:var(--cyan)}
.m-tier{margin-left:auto; font-weight:800; letter-spacing:.03em}
.m-tier.ouro{color:var(--gold)} .m-tier.prata{color:var(--silver)} .m-tier.grupo{color:var(--ink-3)}
.m-row{display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; padding:5px 0}
.m-row .pl{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.m-row .pl.tbd{color:var(--ink-3); font-style:italic; font-weight:600}
.m-row.win .pl{color:var(--green); font-weight:800}
.m-row .pl .ptag{font-size:9.5px; font-weight:800; color:var(--ink-3); margin-left:5px; letter-spacing:.02em}
.scorebox{width:46px; height:38px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
  border-radius:8px; text-align:center; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums}
.scorebox:focus{outline:2px solid var(--brand-soft); border-color:var(--blue)}
.scorebox:disabled{opacity:.6}
.m-vs{text-align:center; font-size:10px; color:var(--ink-3); font-weight:700; letter-spacing:.1em; margin:1px 0}

/* ============================================================ CHAVES / BRACKET */
.bracket-wrap{overflow-x:auto; padding-bottom:8px}
.tier-h{display:flex; align-items:center; gap:10px; margin:6px 2px 14px}
.tier-h .t{font-size:17px; font-weight:800; letter-spacing:-.01em}
.tier-h .badge{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:999px}
.tier-h .badge.ouro{background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold)}
.tier-h .badge.prata{background:var(--silver-soft); color:var(--silver); border:1px solid var(--silver)}
.bracket{display:flex; gap:18px; align-items:stretch; min-width:min-content}
.bcol{display:flex; flex-direction:column; justify-content:space-around; gap:14px; min-width:230px}
.bcol-h{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); margin-bottom:2px; text-align:center}
.bmatch{background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
.bmatch .bm-h{font-size:10px; font-weight:700; color:var(--ink-3); padding:6px 11px 0; letter-spacing:.03em}
.brow{display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; padding:8px 11px}
.brow+.brow{border-top:1px solid var(--line-2)}
.brow .pl{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brow .pl.tbd{color:var(--ink-3); font-style:italic}
.brow.win .pl{color:var(--green); font-weight:800}
.brow .sb{width:40px; height:32px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
  border-radius:7px; text-align:center; font-size:15px; font-weight:800}
.brow .sb:disabled{opacity:.55}
.champ{margin-top:10px; padding:13px; border-radius:11px; text-align:center; background:linear-gradient(135deg,var(--gold-soft),transparent); border:1px solid var(--gold)}
.champ.prata{background:linear-gradient(135deg,var(--silver-soft),transparent); border-color:var(--silver)}
.champ .lbl{font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.champ .nm{font-size:18px; font-weight:800; margin-top:3px}
.champ .nm.tbd{color:var(--ink-3); font-style:italic; font-size:14px; font-weight:600}

/* ============================================================ REGRAS */
.rules-hero{display:flex; align-items:center; gap:16px; color:#fff; border-radius:14px; padding:20px 22px; margin:2px 0 20px;
  background:linear-gradient(120deg,#123FD6,#0522A6)}
.rules-hero .rt{font-weight:800; font-size:21px; line-height:1.1}
.rules-hero .rs{color:rgba(255,255,255,.85); font-size:13px; font-weight:500; margin-top:5px; max-width:560px}
.rsec-h{font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); margin:24px 2px 12px}
.rules-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px}
.rule-card{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:15px 16px; box-shadow:var(--shadow)}
.rule-card .big{font-weight:800; font-size:26px; color:var(--blue)}
.rule-card.gold .big{color:var(--gold)} .rule-card.silver .big{color:var(--silver)}
.rule-card h4{font-weight:800; margin:4px 0 4px; font-size:14.5px}
.rule-card p{margin:0; color:var(--ink-2); font-size:12.5px; line-height:1.5}
.rtable{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:13px; overflow:hidden; font-size:13.5px; box-shadow:var(--shadow)}
.rtable th,.rtable td{padding:10px 13px; text-align:left; border-bottom:1px solid var(--line-2)}
.rtable th{background:var(--panel-2); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:800}
.rtable td b{color:var(--ink)}
.rtable tr:last-child td{border-bottom:0}
.rules-text{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:16px 18px; color:var(--ink-2); font-size:13.5px; line-height:1.85; box-shadow:var(--shadow)}
.rules-text b{color:var(--ink)}

/* ============================================================ SORTEIO / DRAFT */
.potes-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:18px}
.pote{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.pote-h{display:flex; align-items:center; gap:9px; padding:12px 14px; border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.pote-h .n{width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,var(--blue),var(--navy)); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center}
.pote-h .t{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2)}
.pote-h .pos{margin-left:auto; font-size:10.5px; color:var(--ink-3); font-weight:700}
.pote .inp{width:100%; border:0; border-top:1px solid var(--line-2); background:transparent; color:var(--ink);
  padding:9px 14px; font-size:13.5px; font-weight:600}
.pote .inp:focus{outline:0; background:var(--panel-2)}
.pote .inp.done{color:var(--ink); font-weight:700}
.draft-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
.stage{position:relative; background:linear-gradient(120deg,#0F1738,#0522A6); border-radius:16px; padding:30px 24px; text-align:center; color:#fff; overflow:hidden; min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 12px 40px rgba(5,34,166,.28)}
.stage .eyebrow{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--brand-soft)}
.stage .reveal-name{font-size:32px; font-weight:800; letter-spacing:-.02em; margin:8px 0 4px; min-height:40px; line-height:1.1}
.stage .reveal-name.cycling{color:#D7F171; opacity:.9}
.stage .reveal-dest{font-size:15px; font-weight:700; color:#fff; opacity:0; transition:opacity .3s}
.stage .reveal-dest.show{opacity:1}
.stage .reveal-dest .gtag2{display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 8px; border-radius:8px; background:#D7F171; color:#0522A6; font-weight:800; margin-left:6px; vertical-align:middle}
.stage .progress{position:absolute; bottom:12px; left:0; right:0; font-size:11px; color:rgba(255,255,255,.6); font-weight:600}
.stage.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.98)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
.mini-groups{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; margin-top:18px}
.mini-g{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:0; overflow:hidden; box-shadow:var(--shadow)}
.mini-g .mh{display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--panel-2); border-bottom:1px solid var(--line-2)}
.mini-g .mh .gtag{width:26px; height:26px; font-size:13px; border-radius:7px}
.mini-g .mh b{font-size:12px; font-weight:800}
.mini-g .slot{display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:13px; border-top:1px solid var(--line-2)}
.mini-g .slot:first-child{border-top:0}
.mini-g .slot .pl{font-weight:600}
.mini-g .slot .pl.tbd{color:var(--ink-3); font-style:italic; font-weight:500}
.mini-g .slot.just{animation:flash 1s ease}
@keyframes flash{0%{background:rgba(215,241,113,.5)}100%{background:transparent}}
.confetti-c{position:fixed; inset:0; pointer-events:none; z-index:80; overflow:hidden; display:none}
.confetti-c.go{display:block}
.conf{position:absolute; top:-20px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(680deg); opacity:.9}}

.toast{position:fixed; bottom:88px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg);
  padding:11px 18px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:90}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.seedcols{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
@media (max-width:760px){ .seedcols{grid-template-columns:1fr} }
.tiemark{display:inline-block; color:var(--wine); font-weight:800; margin-left:2px}
.tiebox{margin:10px 2px 0; padding:13px 15px; border:1px solid var(--gold); border-radius:11px; background:linear-gradient(120deg,var(--gold-soft),transparent)}
.tieh{font-size:13px; font-weight:800; color:var(--ink); margin-bottom:3px}
.tiesub{font-size:12px; color:var(--ink-2); margin-bottom:10px; line-height:1.45}
.tiechips{display:flex; flex-wrap:wrap; gap:8px}
.tiechip{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:9px; padding:8px 13px; font-size:13.5px; font-weight:600}
.tiechip:hover{border-color:var(--blue)}
.tiechip.set{border-color:var(--gold); background:var(--gold-soft)}
.tiechip .tiepos{font-weight:800; color:var(--gold); font-size:12px}
.tiebox.done{border-color:var(--green); background:linear-gradient(120deg,rgba(109,190,69,.12),transparent)}
.tiebox.done .tiechip.set{border-color:var(--green); background:rgba(109,190,69,.12)}
.tiebox.done .tiechip .tiepos{color:var(--green)}
.tiedone{font-size:11px; font-weight:800; color:var(--green)}
.lockchip{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800; color:var(--green); background:rgba(109,190,69,.12); border:1px solid var(--green); border-radius:999px; padding:8px 14px}
.foot{max-width:1200px; margin:0 auto; padding:8px 24px 40px; font-size:11px; color:var(--ink-3)}

/* ============================================================ ESTADO */
function defaultState(){
  const potes=JSON.parse(JSON.stringify(ROSTER));
  const letters=JSON.parse(JSON.stringify(DRAW));
  return { potes, letters, drawDone:true, potesLocked:true, results:{}, finals:{}, nadal:{a:"",b:"",ra:null,rb:null}, tiebreaks:{} };
}
let S = defaultState();
let VIEW = "classificacao";
let PHASE = "grupos";

/* ============================================================ PERSISTÊNCIA */
let DBH=null, LIVE=false;
function persistLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(S)); }catch(e){} }
function saveResult(id){ persistLocal(); if(LIVE&&DBH){ DBH.collection("resultados").doc(id).set(S.results[id]||{a:null,b:null}).catch(()=>{}); } }
function saveFinal(slot){ persistLocal(); if(LIVE&&DBH){ DBH.collection("finais").doc(slot).set(S.finals[slot]||{a:null,b:null}).catch(()=>{}); } }
function saveConfig(){ persistLocal(); if(LIVE&&DBH){ DBH.collection("config").doc("torneio").set({potes:S.potes, letters:S.letters, drawDone:S.drawDone, potesLocked:S.potesLocked, nadal:S.nadal, tiebreaks:S.tiebreaks}).catch(()=>{}); } }
function saveEverything(){
  persistLocal();
  if(LIVE&&DBH){
    saveConfig();
    GAMES.forEach(g=> DBH.collection("resultados").doc(g.id).set(S.results[g.id]||{a:null,b:null}).catch(()=>{}));
    Object.keys(BRACKET).forEach(s=> DBH.collection("finais").doc(s).set(S.finals[s]||{a:null,b:null}).catch(()=>{}));
  }
}
function initData(){
  try{ const raw=localStorage.getItem(LKEY); if(raw) S=Object.assign(defaultState(), JSON.parse(raw)); }catch(e){}
  // Sorteio é fixo no código — ignora qualquer sorteio antigo salvo.
  S.potes=JSON.parse(JSON.stringify(ROSTER)); S.letters=JSON.parse(JSON.stringify(DRAW)); S.drawDone=true; S.potesLocked=true;
  if(!DEMO && typeof firebase!=="undefined" && firebase.initializeApp){
    try{
      firebase.initializeApp(firebaseConfig);
      DBH=firebase.firestore(); LIVE=true;
      DBH.collection("config").doc("torneio").onSnapshot(d=>{
        if(d.exists){ const c=d.data(); if(c.nadal)S.nadal=c.nadal; S.tiebreaks=c.tiebreaks||{}; }
        render();
      }, ()=>{});
      DBH.collection("resultados").onSnapshot(s=>{ s.forEach(doc=> S.results[doc.id]=doc.data()); render(); }, ()=>{});
      DBH.collection("finais").onSnapshot(s=>{ s.forEach(doc=> S.finals[doc.id]=doc.data()); render(); }, ()=>{});
    }catch(e){ LIVE=false; }
  }
  render();
}

/* ============================================================ HELPERS */
const $ = (s,el=document)=> el.querySelector(s);
function poteOf(pid){ return +pid[0]; }
function letterIdx(pid){ return pid.charCodeAt(1)-65; }
function isNamed(pid){ const p=poteOf(pid),i=letterIdx(pid); return !!(S.drawDone && S.letters[p] && S.letters[p][i]); }
function pn(pid){ // nome do atleta ou rótulo Pn-X
  if(!pid) return null;
  const p=poteOf(pid), i=letterIdx(pid);
  const v = S.drawDone && S.letters[p] && S.letters[p][i];
  return v || ("P"+p+"-"+pid[1]);
}
function poteTag(pid){ return "P"+poteOf(pid); }
function resultValid(r){ return r && r.a!=null && r.b!=null && r.a!=="" && r.b!==""; }

/* ============================================================ RANKING (22 atletas) */
function allPids(){ const out=[]; POTES.forEach(p=>{ for(let i=0;i<POTE_SIZE[p];i++) out.push(p+LETTERS[i]); }); return out; }
function allGamesComplete(){ return GAMES.every(g=> resultValid(S.results[g.id])); }
function playedCount(){ return GAMES.filter(g=> resultValid(S.results[g.id])).length; }

function computeRanking(){
  const st={};
  allPids().forEach(pid=> st[pid]={pid, name:pn(pid), pote:poteOf(pid), w:0, gw:0, gl:0, played:0});
  GAMES.forEach(g=>{
    const r=S.results[g.id];
    if(resultValid(r)){
      const a=+r.a, b=+r.b;
      st[g.a].gw+=a; st[g.a].gl+=b; st[g.b].gw+=b; st[g.b].gl+=a; st[g.a].played++; st[g.b].played++;
      if(a>b) st[g.a].w++; else if(b>a) st[g.b].w++;
    }
  });
  Object.values(st).forEach(x=> x.saldo=x.gw-x.gl);
  let arr=Object.values(st).sort((x,y)=> y.w-x.w || y.saldo-x.saldo || x.gl-y.gl || x.pid.localeCompare(y.pid));
  // Tie-break manual: clusters idênticos em vitórias/saldo/games perdidos (2+)
  const tieTag={};
  let a=0;
  while(a<arr.length){
    let b=a; while(b+1<arr.length && arr[b+1].w===arr[a].w && arr[b+1].saldo===arr[a].saldo && arr[b+1].gl===arr[a].gl) b++;
    if(b-a>=1){
      const members=arr.slice(a,b+1).map(x=>x.pid);
      const key='rk|'+members.slice().sort().join(',');
      const order=(S.tiebreaks&&S.tiebreaks[key])||[];
      const seg=arr.slice(a,b+1).sort((x,y)=>{ const ix=order.indexOf(x.pid), iy=order.indexOf(y.pid); return (ix<0?99:ix)-(iy<0?99:iy); });
      const resolved=members.every(m=> order.includes(m));
      for(let z=0;z<seg.length;z++){ arr[a+z]=seg[z]; }
      members.forEach(m=> tieTag[m]={key, members:members.slice(), resolved});
    }
    a=b+1;
  }
  return arr.map((x,i)=> ({...x, rank:i+1, tie: tieTag[x.pid]||null}));
}
let _rankCache=null, _rankKey=null;
function ranking(){
  const key=JSON.stringify([S.results,S.tiebreaks,S.letters,S.drawDone]);
  if(_rankKey===key) return _rankCache;
  _rankKey=key; _rankCache=computeRanking(); return _rankCache;
}
function rankArr(){ // 1-indexed array de pids segundo o ranking
  const rk=ranking(); const arr=[null]; rk.forEach(r=> arr.push(r)); return arr;
}

/* ============================================================ CHAVES */
function resolveRef(ref){
  if(ref.rank!=null){ return allGamesComplete()? rankArr()[ref.rank] : null; }
  if(ref.win!=null){ return winnerOf(ref.win); }
  if(ref.lose!=null){ return loserOf(ref.lose); }
  return null;
}
function bracketPlayers(slot){ const b=BRACKET[slot]; return { a:resolveRef(b.a), b:resolveRef(b.b) }; }
function winnerOf(slot){
  const p=bracketPlayers(slot), r=S.finals[slot];
  if(!p.a||!p.b||!resultValid(r)||+r.a===+r.b) return null;
  return (+r.a>+r.b)? p.a : p.b;
}
function loserOf(slot){
  const p=bracketPlayers(slot), r=S.finals[slot];
  if(!p.a||!p.b||!resultValid(r)||+r.a===+r.b) return null;
  return (+r.a>+r.b)? p.b : p.a;
}
function fpn(pl){ return pl? (pl.name || pn(pl.pid)) : null; }
const SLOT_SHORT = {OQF1:"QF1",OQF2:"QF2",OQF3:"QF3",OQF4:"QF4",OSF1:"Semi 1",OSF2:"Semi 2",PQF1:"QF1",PQF2:"QF2",PQF3:"QF3",PQF4:"QF4",PSF1:"Semi 1",PSF2:"Semi 2"};
function refLabel(ref){
  if(!ref) return "a definir";
  if(ref.rank!=null) return ref.rank+"º geral";
  if(ref.win!=null) return "Vencedor "+(SLOT_SHORT[ref.win]||ref.win);
  if(ref.lose!=null) return "Perdedor "+(SLOT_SHORT[ref.lose]||ref.lose);
  return "a definir";
}

}

/* ============================================================ CLASSIFICAÇÃO */
function destOf(rank){ return rank<=8?'ouro':(rank<=16?'prata':'out'); }
function renderClassificacao(){
  const rk=ranking();
  const complete=allGamesComplete();
  const rows=rk.map(r=>{
    const dest=destOf(r.rank);
    const cls = r.rank<=8?'q1':(r.rank<=16?'q2':'');
    const cut = (r.rank===9||r.rank===17) ? ' style="border-top:2px dashed var(--gold)"':'';
    const badge = dest==='ouro'?'<span class="qbadge ouro">Ouro</span>'
                 : dest==='prata'?'<span class="qbadge prata">Prata</span>'
                 : '<span class="qbadge out">fora</span>';
    return `<tr class="${cls}">
      <td class="pos"${cut}>${r.rank}${r.tie&&!r.tie.resolved?' <span class="tiemark" title="empate a definir">=</span>':''}</td>
      <td class="l name"${cut}>${r.name} <span class="pote-badge">P${r.pote}</span>${badge}</td>
      <td class="pp num"${cut}>${r.w}</td>
      <td class="num"${cut}>${r.played}</td>
      <td class="num"${cut}>${r.gw}</td>
      <td class="num"${cut}>${r.gl}</td>
      <td class="num"${cut}>${r.saldo>0?'+':''}${r.saldo}</td></tr>`;
  }).join("");
  // paineis de tie-break
  const seen={}; let panels="";
  rk.forEach(r=>{ if(r.tie && !seen[r.tie.key]){ seen[r.tie.key]=1;
    const members=r.tie.members.map(pid=> ({id:pid, label:pn(pid)+' · P'+poteOf(pid)}));
    panels += tiePanel('Empate no ranking', r.tie.key, members);
  }});

  const status = complete
    ? `<div class="banner"><span>✅ <b>Classificação encerrada.</b> Chaves Ouro (1º–8º) e Prata (9º–16º) montadas na aba <b>Chaves</b>.</span></div>`

  const prataSeed=[[9,'QF1'],[10,'QF4'],[11,'QF3'],[12,'QF2'],[13,'QF2'],[14,'QF3'],[15,'QF4'],[16,'QF1']]
    .map(([n,q])=> seedRow(n,'prata',q)).join("");

      <div class="card"><div class="card-h"><h3>Chave Ouro · 1º–8º</h3></div>

    </div></div>`;

  return `<div class="page-head"><div><h1>Classificação</h1><p>Ranking único dos 22 atletas (3 jogos cada). 1º–8º → Chave Ouro; 9º–16º → Chave Prata; 17º–22º encerram na classificatória.</p></div>

/* ============================================================ JOGOS / SCHEDULE */
function scoreInput(kind, id, side, val){
  const v = val==null?"":val;
  return `<input class="scorebox num" inputmode="numeric" maxlength="2" value="${v}"
    onchange="setScore('${kind}','${id}','${side}',this.value)" aria-label="games ${side}">`;
}
function courtChip(ci){ const c=COURTS[ci]; return `<span class="court ${c.type}">${c.name}</span>`; }
function nadalCard(ci, cont){
  if(cont){
    return `<div class="match nadal"><div class="m-top">${courtChip(ci)}<span class="m-tier ouro">🎾 Especial</span></div>
      <div class="m-vs" style="margin-top:14px">🎾 TAÇA NADAL</div>
      <div style="text-align:center;font-size:11.5px;color:var(--ink-3);font-weight:600;padding:6px 0 2px">jogo único de 2h · em andamento (12h–14h)</div></div>`;
  }
  const n=S.nadal;
  return `<div class="match nadal"><div class="m-top">${courtChip(ci)}<span class="m-tier ouro">🎾 Especial · 2h (12h–14h)</span></div>
    <div class="m-row"><input class="scorebox" style="width:auto;flex:1;text-align:left;padding:0 10px;font-size:13px;font-weight:600" placeholder="Jogador 1" value="${(n.a||'').replace(/"/g,'&quot;')}" onchange="setNadal('a',this.value)">
      ${scoreInput('nadal','x','ra',n.ra)}</div>
    <div class="m-vs">TAÇA NADAL</div>
    <div class="m-row"><input class="scorebox" style="width:auto;flex:1;text-align:left;padding:0 10px;font-size:13px;font-weight:600" placeholder="Jogador 2" value="${(n.b||'').replace(/"/g,'&quot;')}" onchange="setNadal('b',this.value)">
      ${scoreInput('nadal','x','rb',n.rb)}</div></div>`;
}
function emptyCard(ci){ return `<div class="match empty"><div class="m-top">${courtChip(ci)}<span class="m-tier grupo">livre</span></div><div class="m-vs">— sem jogo —</div></div>`; }
function groupMatchCard(cell, ci){
  if(!cell) return emptyCard(ci);
  if(cell.nadal) return nadalCard(ci,false);
  if(cell.nadalCont) return nadalCard(ci,true);
  const g=GAME_BY_ID[cell.m], id=g.id, r=S.results[id]||{};
  const a=r.a,b=r.b, aw=(resultValid(r)&&+a>+b), bw=(resultValid(r)&&+b>+a);
  return `<div class="match"><div class="m-top">${courtChip(ci)}<span class="m-tier grupo">${cell.m}</span></div>
    <div class="m-row ${aw?'win':''}"><span class="pl ${isNamed(g.a)?'':'tbd'}">${pn(g.a)}<span class="ptag">${poteTag(g.a)}</span></span>${scoreInput('group',id,'a',a)}</div>
    <div class="m-vs">SET ATÉ 4 · 30 MIN</div>
    <div class="m-row ${bw?'win':''}"><span class="pl ${isNamed(g.b)?'':'tbd'}">${pn(g.b)}<span class="ptag">${poteTag(g.b)}</span></span>${scoreInput('group',id,'b',b)}</div></div>`;
}
function bracketMatchCardSchedule(slot, ci){
  if(!slot) return emptyCard(ci);
  const b=BRACKET[slot], p=bracketPlayers(slot), r=S.finals[slot]||{};
  const na=fpn(p.a), nb=fpn(p.b);
  const a=r.a,bb=r.b, aw=(resultValid(r)&&+a>+bb), bw=(resultValid(r)&&+bb>+a);
  return `<div class="match"><div class="m-top">${courtChip(ci)}<span class="m-tier ${b.tier}">${b.tier==='ouro'?'Ouro':'Prata'}</span></div>
    <div class="m-row ${aw?'win':''}"><span class="pl ${na?'':'tbd'}">${na||refLabel(b.a)}</span>${scoreInput('final',slot,'a',a)}</div>
    <div class="m-vs">${b.label.toUpperCase()}</div>
    <div class="m-row ${bw?'win':''}"><span class="pl ${nb?'':'tbd'}">${nb||refLabel(b.b)}</span>${scoreInput('final',slot,'b',bb)}</div></div>`;
}
function renderJogos(){
  const tabs=`<div class="phasetabs">
    <button class="phasetab ${PHASE==='grupos'?'on':''}" onclick="setPhase('grupos')">Classificatória</button>
    <button class="phasetab ${PHASE==='finais'?'on':''}" onclick="setPhase('finais')">Fases finais</button></div>`;
  let body="";
  if(PHASE==="grupos"){
    body=GROUP_SCHEDULE.map((rnd,idx)=>{
      const cards=rnd.courts.map((c,ci)=> groupMatchCard(c, ci)).join("");
      const isLast = idx===GROUP_SCHEDULE.length-1;
      return `<div class="round"><div class="round-h"><span class="t num">${rnd.time}</span><span class="lab">rodada ${idx+1}</span>${isLast?'<span class="break">pausa 14h30–15h00</span>':''}</div>
        <div class="mgrid">${cards}</div></div>`;
    }).join("");
  } else {
    const note = allGamesComplete()? "" : `<div class="banner"><span>Os confrontos preenchem automaticamente quando a classificatória terminar (${playedCount()}/33). QF da Ouro priorizam as quadras de saibro.</span></div>`;
    body=note+FINALS_SCHEDULE.map(rnd=>{
      const cards=rnd.courts.map((c,ci)=> bracketMatchCardSchedule(c, ci)).join("");
      return `<div class="round"><div class="round-h"><span class="t num">${rnd.time}</span><span class="lab">${rnd.lab} · 1 set · 45 min</span></div>
        <div class="mgrid">${cards}</div></div>`;
    }).join("");
  }
  return `<div class="page-head"><div><h1>Jogos</h1><p>Placar por quadra e horário. Insira os games — o ranking e as chaves atualizam sozinhos${DEMO?'':' e sincronizam ao vivo'}.</p></div>
    <div class="stamp">5 quadras · 30 min (classif.) / 45 min (finais)</div></div>${tabs}${body}`;
}
function setPhase(p){ PHASE=p; render(); }

/* ============================================================ CHAVES / BRACKET */
function brow(slot, side){
  const b=BRACKET[slot], p=bracketPlayers(slot), r=S.finals[slot]||{};
  const pl = side==='a'? p.a : p.b;
  const nm = fpn(pl);
  const val = side==='a'? r.a : r.b;
  const other = side==='a'? r.b : r.a;
  const win = (val!=null&&other!=null&&val!==""&&other!==""&&+val>+other);
  return `<div class="brow ${win?'win':''}"><span class="pl ${nm?'':'tbd'}">${nm||refLabel(side==='a'?b.a:b.b)}</span>
    <input class="sb num" inputmode="numeric" maxlength="2" value="${val==null?'':val}" onchange="setScore('final','${slot}','${side}',this.value)"></div>`;
}
function bmatch(slot){ const b=BRACKET[slot]; return `<div class="bmatch"><div class="bm-h">${b.label}</div>${brow(slot,'a')}${brow(slot,'b')}</div>`; }

    </div></div>`;
  return `<div class="page-head"><div><h1>Chaves</h1><p>Mata-mata de 1 set (45 min). Vencedores avançam automaticamente conforme os placares entram.</p></div>

/* ============================================================ SORTEIO / DRAFT */
let draftPlan=null, draftIdx=0, draftAnimating=false;
function renderSorteio(){
  const potesHtml=POTES.map(p=>{
    const sz=POTE_SIZE[p];
    const filled=S.potes[p].filter(x=>x&&x.trim()).length;
    const inputs=S.potes[p].map((nm,i)=>`<input class="inp ${S.drawDone?'done':''}" ${S.drawDone||S.potesLocked?'disabled':''} placeholder="Atleta ${i+1}" value="${(nm||'').replace(/"/g,'&quot;')}" onchange="setPote(${p},${i},this.value)">`).join("");
    return `<div class="pote"><div class="pote-h"><span class="n">${p}</span><span class="t">Pote ${p}</span><span class="pos">${filled}/${sz}</span></div>${inputs}</div>`;
  }).join("");
  const total=POTES.reduce((a,p)=>a+S.potes[p].filter(x=>x&&x.trim()).length,0);
  const ready = POTES.every(p=>S.potes[p].filter(x=>x&&x.trim()).length===POTE_SIZE[p]);

  const stage = `<div class="stage" id="stage">
      <div class="eyebrow">${S.drawDone?'Sorteio concluído':'Sorteio das vagas'}</div>
      <div class="reveal-name" id="revealName">${S.drawDone?'🎾 Chaves definidas':'Pronto para sortear'}</div>
      <div class="reveal-dest ${S.drawDone?'show':''}" id="revealDest">${S.drawDone?'Letras atribuídas dentro de cada pote':''}</div>
      <div class="progress" id="revealProg">${S.drawDone?'22/22 sorteados':(total+'/22 atletas cadastrados')}</div>
    </div>`;

  const mini=`<div class="mini-groups">`+POTES.map(p=>{
    const sz=POTE_SIZE[p];
    const slots=[];
    for(let i=0;i<sz;i++){
      const nm=S.drawDone? (S.letters[p]&&S.letters[p][i]) : null;
      slots.push(`<div class="slot" data-p="${p}" data-i="${i}"><span class="pote-badge">${LETTERS[i]}</span><span class="pl ${nm?'':'tbd'}">${nm||('· P'+p+'-'+LETTERS[i])}</span></div>`);
    }
    return `<div class="mini-g"><div class="mh"><span class="gtag">${p}</span><b>Pote ${p}</b></div>${slots.join("")}</div>`;
  }).join("")+`</div>`;

  const bar = S.drawDone
    ? (S.potesLocked
        ? `<div class="draft-bar"><span class="lockchip">🔒 Sorteio travado</span>
            <button class="btn ghost" onclick="toggleLock()">🔓 Destravar</button>
            <span style="font-size:12.5px;color:var(--ink-3)">Sorteio protegido — refazer, limpar e zerar tudo estão bloqueados.</span></div>`
        : `<div class="draft-bar"><button class="btn primary" onclick="toggleLock()">🔒 Travar sorteio</button>
            <button class="btn ghost" onclick="redoDraw()">↺ Refazer sorteio</button>
            <button class="btn ghost" style="color:var(--wine)" onclick="resetSorteio()">🗑 Limpar tudo</button>
            <span style="font-size:12.5px;color:var(--ink-3)">Trave o sorteio após definido para não perdê-lo.</span></div>`)
    : `<div class="draft-bar">
        <button class="btn primary" id="btnNext" ${ready?'':'disabled'} onclick="draftNext()">🎲 Sortear próximo</button>
        <button class="btn" id="btnAuto" ${ready?'':'disabled'} onclick="draftAll()">⏩ Sortear tudo</button>
        <button class="btn ghost" onclick="loadRoster()">Carregar inscritos</button>
        <button class="btn ghost" style="color:var(--wine)" onclick="resetSorteio()">🗑 Limpar nomes</button>
        ${ready?'':'<span style="font-size:12.5px;color:var(--ink-3)">Preencha todos os potes (6/6/5/5) para liberar o sorteio.</span>'}
      </div>`;

  return `<div class="page-head"><div><h1>Sorteio</h1><p>Os nomes de cada pote são fixos; o sorteio define <b>qual vaga (A, B, C…)</b> cada atleta ocupa dentro do seu pote. Isso resolve todos os 33 confrontos da classificatória.</p></div>
    <div class="stamp">4 potes · 6/6/5/5</div></div>
    ${bar}${stage}
    <div class="rsec-h">Potes &amp; vagas</div>${mini}
    ${ S.drawDone?'' : '<div class="rsec-h">Editar nomes dos potes</div><div class="potes-grid">'+potesHtml+'</div>'}`;
}
function setPote(p,i,v){ if(S.potesLocked||S.drawDone) return; S.potes[p][i]=v.trim(); saveConfig(); render(); }
function loadRoster(){ S.potes=JSON.parse(JSON.stringify(ROSTER)); saveConfig(); render(); toast("Inscritos carregados nos potes."); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildPlan(){
  const plan=[];
  POTES.forEach(p=>{
    const names=shuffle(S.potes[p].slice(0,POTE_SIZE[p]));
    names.forEach((nm,i)=> plan.push({pote:p, li:i, name:nm}));
  });
  return plan;
}
function ensurePlan(){ if(!draftPlan){ draftPlan=buildPlan(); draftIdx=0; POTES.forEach(p=> S.letters[p]=[]); } }
function commitReveal(item){
  if(!S.letters[item.pote]) S.letters[item.pote]=[];
  S.letters[item.pote][item.li]=item.name;
  const stage=$("#stage"); if(stage) stage.classList.add("pop");
  saveConfig();
  const slot=document.querySelector(`.mini-g .slot[data-p="${item.pote}"][data-i="${item.li}"]`);
  if(slot){ slot.classList.add("just"); const pl=slot.querySelector(".pl"); pl.textContent=item.name; pl.classList.remove("tbd"); }
}
function draftNext(cb){
  if(S.potesLocked || draftAnimating) return;
  ensurePlan();
  if(draftIdx>=draftPlan.length){ finishDraw(); if(cb)cb(); return; }
  const item=draftPlan[draftIdx];
  const nameEl=$("#revealName"), destEl=$("#revealDest"), progEl=$("#revealProg");
  if(!nameEl||!destEl||!progEl){ if(cb)cb(); return; }
  draftAnimating=true;
  const btnN=$("#btnNext"), btnA=$("#btnAuto"); if(btnN)btnN.disabled=true; if(btnA)btnA.disabled=true;
  destEl.classList.remove("show"); nameEl.classList.add("cycling");
  const pool=draftPlan.filter(x=>x.pote===item.pote).map(x=>x.name);
  let ticks=0; const maxT=16;
  const spin=setInterval(()=>{
    nameEl.textContent = pool[Math.floor(Math.random()*pool.length)];
    ticks++;
    if(ticks>=maxT){
      clearInterval(spin);
      nameEl.classList.remove("cycling");
      nameEl.textContent=item.name;
      destEl.innerHTML=`Pote ${item.pote} · Vaga <span class="gtag2">${LETTERS[item.li]}</span>`;
      destEl.classList.add("show");
      commitReveal(item);
      draftIdx++;
      progEl.textContent = `${draftIdx}/22 sorteados`;
      setTimeout(()=>{
        draftAnimating=false;
        if(btnN)btnN.disabled=false; if(btnA)btnA.disabled=false;
        if(draftIdx>=draftPlan.length) finishDraw();
        if(cb) cb();
      }, 420);
    }
  }, 55);
}
function draftAll(){
  if(S.potesLocked) return;
  ensurePlan();
  while(draftIdx<draftPlan.length){ const it=draftPlan[draftIdx]; if(!S.letters[it.pote])S.letters[it.pote]=[]; S.letters[it.pote][it.li]=it.name; draftIdx++; }
  finishDraw();
}
function finishDraw(){
  if(S.drawDone) return;
  S.drawDone=true; saveConfig();
  const nameEl=$("#revealName"), destEl=$("#revealDest");
  if(nameEl) nameEl.textContent="🏆 Chaves definidas!";
  if(destEl){ destEl.innerHTML="Boa sorte a todos"; destEl.classList.add("show"); }
  confetti();
  setTimeout(()=>{ toast("Sorteio concluído! Confrontos aplicados em todo o torneio."); render(); }, 1200);
}
function toggleLock(){
  if(S.potesLocked){ if(!askCode()) return; S.potesLocked=false; saveConfig(); render(); toast("Sorteio destravado."); }
  else { S.potesLocked=true; saveConfig(); render(); toast("Sorteio travado 🔒"); }
}
function resetScores(){
  if(!askCode()) return;
  if(!confirm("Zerar APENAS os placares (classificatória, finais e Taça Nadal)? O sorteio e os nomes são mantidos.")) return;
  S.results={}; S.finals={}; S.tiebreaks={}; S.nadal.ra=null; S.nadal.rb=null;
  saveEverything(); render(); toast("Placares zerados. Sorteio mantido.");
}
function resetSorteio(){
  if(S.potesLocked){ toast("Sorteio travado — destrave primeiro."); return; }
  if(!askCode()) return;
  if(!confirm("Limpar o sorteio? Apaga as vagas sorteadas (os nomes dos potes são mantidos). Placares mantidos.")) return;
  POTES.forEach(p=> S.letters[p]=[]);
  S.drawDone=false; draftPlan=null; draftIdx=0;
  saveConfig(); render(); toast("Sorteio limpo.");
}
function redoDraw(){
  if(S.potesLocked){ toast("Sorteio travado — destrave primeiro."); return; }
  if(!askCode()) return;
  if(!confirm("Refazer o sorteio? Isso re-sorteia as vagas dentro dos potes (nomes mantidos).")) return;
  POTES.forEach(p=> S.letters[p]=[]);
  S.drawDone=false; draftPlan=null; draftIdx=0; saveConfig(); render();
}
function confetti(){
  const c=$("#confetti"); c.innerHTML=""; c.classList.add("go");
  const cols=["#123FD6","#00AEEF","#6DBE45","#C8871A","#D7F171","#2FA98E"];
  for(let i=0;i<90;i++){
    const d=document.createElement("div"); d.className="conf";
    d.style.left=Math.random()*100+"%"; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.6+Math.random()*1.6)+"s"; d.style.animationDelay=(Math.random()*.5)+"s";
    c.appendChild(d);
  }
  setTimeout(()=>{ c.classList.remove("go"); c.innerHTML=""; }, 3600);
}

/* ============================================================ SETTERS DE PLACAR */
function setScore(kind,id,side,val){
  const v=val.trim()===""?null:Math.max(0,Math.min(20,parseInt(val,10)||0));
  if(kind==="group"){ if(!S.results[id]) S.results[id]={a:null,b:null}; S.results[id][side]=v; saveResult(id); }
  else if(kind==="final"){ if(!S.finals[id]) S.finals[id]={a:null,b:null}; S.finals[id][side]=v; saveFinal(id); }
  else if(kind==="nadal"){ S.nadal[side]=v; saveConfig(); }
  render();
}
function setNadal(side,val){ S.nadal[side]=val.trim(); saveConfig(); }

/* ============================================================ TIE-BREAK MANUAL */
function tiePanel(title, key, members){
  const order=(S.tiebreaks&&S.tiebreaks[key])||[];
  const resolved = members.length && members.every(m=> order.includes(m.id));
  const chips=members.map(m=>{
    const pos=order.indexOf(m.id);
    return `<button class="tiechip ${pos>=0?'set':''}" onclick="pickTie('${key}','${m.id}')">${pos>=0?`<span class="tiepos">${pos+1}º</span>`:''}${m.label}</button>`;
  }).join("");
  return `<div class="tiebox ${resolved?'done':''}">
    <div class="tieh">⚖ Tie-break — ${title} ${resolved?'<span class="tiedone">✓ definido</span>':'<span style="color:var(--wine);font-weight:800">a definir</span>'}</div>
    <div class="tiesub">${resolved
      ? 'Ordem registrada. Para corrigir: clique num nome para desmarcá-lo e reordene, ou use <b>Limpar desempate</b>.'
      : 'Empate total nos critérios. Jogue o tie-break e clique nos atletas na <b>ordem do resultado</b> (1º clique = melhor colocado).'}</div>
    <div class="tiechips">${chips}</div>
    <button class="btn ghost" style="margin-top:9px;color:var(--wine);padding:6px 12px" onclick="clearTie('${key}')">Limpar desempate</button>
  </div>`;
}
function pickTie(key,id){
  const arr=(S.tiebreaks[key]||[]).slice();
  const i=arr.indexOf(id);
  if(i>=0) arr.splice(i,1); else arr.push(id);
  if(arr.length) S.tiebreaks[key]=arr; else delete S.tiebreaks[key];
  saveConfig(); render();
}
function clearTie(key){ delete S.tiebreaks[key]; saveConfig(); render(); }

/* ============================================================ CÓDIGO ORGANIZADOR */
function askCode(){
  const c=prompt("Código do organizador para confirmar:");
  if(c===null) return false;
  if(c.trim()!==ADMIN_CODE){ toast("Código incorreto."); return false; }
  return true;
}

/* ============================================================ MENU / EXPORT / TEMA */
function toggleTheme(){
  const el=document.documentElement, cur=el.dataset.theme;
  if(cur==="dark"){ delete el.dataset.theme; try{localStorage.setItem("tt_theme","light")}catch(e){} }
  else { el.dataset.theme="dark"; try{localStorage.setItem("tt_theme","dark")}catch(e){} }
}
function toggleMenu(e){ e.stopPropagation(); const m=$("#menu"); m.style.display = m.style.display==="none"?"block":"none"; }
document.addEventListener("click",()=>{ const m=$("#menu"); if(m) m.style.display="none"; });
function doExport(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="vinci-compass-open.json"; a.click(); toast("Estado exportado.");
}
function doImport(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ S=Object.assign(defaultState(), JSON.parse(r.result)); saveEverything(); render(); toast("Estado importado."); }catch(e){ toast("Arquivo inválido."); } };
  r.readAsText(f); ev.target.value="";
}
function doReset(){
  if(S.potesLocked){ toast("Sorteio travado — destrave para zerar tudo."); return; }
  if(!askCode()) return;
  if(!confirm("Zerar TUDO (potes, sorteio e placares)? Não dá para desfazer.")) return;
  S=defaultState(); draftPlan=null; draftIdx=0; saveEverything(); render(); toast("Torneio zerado.");
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2400); }

/* ============================================================ INIT */
initData();
</script>
