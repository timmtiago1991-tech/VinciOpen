<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#123FD6" />
<title>Vinci Compass Open</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- tema antes de pintar -->
<script>try{if(localStorage.getItem("tt_theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>

<!-- Firebase (compat) — mesmo padrão do Broslao -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
/* ============================================================
   Tokens — paleta institucional (referência RadarPE) + acentos esportivos
   ============================================================ */
:root{
  --navy:#0522A6; --blue:#123FD6; --blue-2:#1560E0; --cyan:#00AEEF;
  --teal:#2FA98E; --green:#6DBE45; --wine:#8E3A63;
  --gold:#C8871A; --gold-soft:#F5E9CF; --silver:#8390B4; --silver-soft:#E9ECF5;
  --up:#2FA98E; --down:#8E3A63; --flat:#8C97B8; --live:#D2544E;

  --bg:#F5F7FB; --panel:#FFFFFF; --panel-2:#FBFCFE;
  --ink:#12204A; --ink-2:#4A567C; --ink-3:#8390B4;
  --line:#E4E9F4; --line-2:#EEF1F8; --brand-soft:#7FB0F2;

  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(9,26,84,.06), 0 8px 24px rgba(9,26,84,.05);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#070D24; --panel:#0F1738; --panel-2:#0C1330;
  --ink:#EAEEFB; --ink-2:#A9B4DA; --ink-3:#6E7AA6;
  --line:#1E2853; --line-2:#182146; --brand-soft:#7FB0F2;
  --gold:#E0A526; --gold-soft:#33291020; --silver:#A9B4DA; --silver-soft:#1A2246;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:Inter,'Helvetica Neue',Arial,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5;
  transition:background .25s ease,color .25s ease;
}
button{font-family:inherit; cursor:pointer}
input,select{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* ============================================================ HEADER (RadarPE) */
.hdr{position:sticky; top:0; z-index:40;
  background:linear-gradient(115deg,#123FD6 0%,#0522A6 100%);
  box-shadow:0 2px 10px rgba(5,34,166,.28); color:#fff;}
.hdr__in{max-width:1200px; margin:0 auto; padding:0 24px; height:64px; display:flex; align-items:center; gap:26px;}
.brand{display:flex; align-items:center; gap:11px; background:none; border:0; padding:0; cursor:pointer;}
.logo-chip{width:40px; height:40px; border-radius:10px; background:#fff; flex:none;
  display:flex; align-items:center; justify-content:center; padding:4px; box-shadow:0 1px 4px rgba(0,0,0,.18)}
.logo-chip img{width:100%; height:100%; object-fit:contain; display:block}
.logo-chip.fallback img{display:none}
.logo-chip.fallback::after{content:"VC"; color:var(--navy); font-weight:800; font-size:14px; letter-spacing:-.02em}
.word__name{font-size:18px; font-weight:800; color:#fff; letter-spacing:-.01em; display:block; line-height:1.05}
.word__name em{color:var(--brand-soft); font-style:normal}
.word__tag{display:block; font-size:9px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:#A9C2F0; margin-top:3px}
.nav{flex:1; display:flex; align-items:center; gap:3px}
.nav button{padding:8px 13px; border-radius:8px; font-size:13.5px; font-weight:600;
  color:rgba(255,255,255,.72); background:none; border:0; display:flex; align-items:center; gap:7px}
.nav button:hover{color:#fff; background:rgba(255,255,255,.09)}
.nav button.on{color:#fff; background:rgba(255,255,255,.16); font-weight:700}
.nav .ico{width:15px; height:15px; display:inline-block}
.actions{display:flex; align-items:center; gap:9px; flex:none}
.iconbtn{width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.09); display:flex; align-items:center; justify-content:center; color:#fff}
.iconbtn:hover{background:rgba(255,255,255,.18)}
.modechip{display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.4); border-radius:999px;
  padding:6px 11px; font-size:11px; font-weight:700; color:#fff; letter-spacing:.03em}
.modechip .d{width:7px; height:7px; border-radius:50%; background:#D7F171}
.modechip.demo .d{background:#F2C94C}

/* ============================================================ LAYOUT */
.wrap{max-width:1200px; margin:0 auto; padding:26px 24px 96px}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:20px; flex-wrap:wrap}
.page-head h1{font-size:22px; font-weight:800; letter-spacing:-.02em; margin:0}
.page-head p{margin:4px 0 0; color:var(--ink-2); font-size:13.5px; max-width:640px}
.stamp{font-size:11px; color:var(--ink-3); font-weight:600; white-space:nowrap}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-h{padding:14px 17px 0; display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.card-h h3{margin:0; font-size:14px; font-weight:700; letter-spacing:-.01em}
.src{font-size:10.5px; color:var(--ink-3); font-weight:600}
.btn{border-radius:9px; padding:9px 15px; font-size:13px; font-weight:700; border:1px solid var(--line); background:var(--panel); color:var(--ink-2)}
.btn:hover{color:var(--ink); border-color:var(--ink-3)}
.btn.primary{background:var(--blue); border-color:var(--blue); color:#fff}
.btn.primary:hover{background:var(--navy); color:#fff}
.btn.primary:disabled{opacity:.5; cursor:not-allowed}
.btn.ghost{background:transparent}
.banner{display:flex; align-items:flex-start; gap:9px; background:var(--panel-2); border:1px solid var(--line);
  border-radius:10px; padding:11px 14px; font-size:12.5px; color:var(--ink-2); margin-bottom:18px}
.banner b{color:var(--ink)}

/* ============================================================ GRUPOS */
.groupsec{margin-bottom:24px}
.group-h{display:flex; align-items:center; gap:11px; margin:0 2px 12px}
.gtag{font-weight:800; font-size:15px; color:#fff; background:linear-gradient(135deg,var(--blue),var(--navy));
  width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center}
.group-h h3{margin:0; font-size:13px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); font-weight:800}
.group-h .meta{font-size:11.5px; color:var(--ink-3); margin-left:auto; font-weight:600}
.gcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
.roster{padding:6px 0 4px}
.roster .r{display:flex; align-items:center; gap:10px; padding:9px 16px; border-top:1px solid var(--line-2); font-size:14px}
.roster .r:first-child{border-top:0}
.pote-badge{font-size:10px; font-weight:800; color:var(--ink-3); background:var(--panel-2); border:1px solid var(--line);
  border-radius:6px; padding:2px 6px; letter-spacing:.03em}
.roster .r .pl{font-weight:600}
.roster .r .pl.tbd{color:var(--ink-3); font-weight:600; font-style:italic}
.roster .r .rec{margin-left:auto; font-size:11.5px; color:var(--ink-3); font-weight:600}

/* ============================================================ CLASSIFICAÇÃO */
.gt{width:100%; border-collapse:collapse; font-size:13px}
.gt th,.gt td{padding:9px 12px; text-align:center; border-top:1px solid var(--line-2)}
.gt th{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:700; border-top:0; background:var(--panel-2)}
.gt td.l,.gt th.l{text-align:left}
.gt td.pos{color:var(--ink-3); font-weight:700; width:34px}
.gt td.name{font-weight:700}
.gt td.pp{font-weight:800; color:var(--blue)}
.gt tr.q1 td.pos{color:var(--gold)} .gt tr.q1{background:linear-gradient(90deg,rgba(200,135,26,.09),transparent)}
.gt tr.q2 td.pos{color:var(--silver)}
.qbadge{font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:5px; text-transform:uppercase; letter-spacing:.04em; margin-left:6px}
.qbadge.ouro{background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold)}
.qbadge.prata{background:var(--silver-soft); color:var(--silver); border:1px solid var(--silver)}
.qbadge.tbd{background:var(--panel-2); color:var(--ink-3); border:1px solid var(--line)}

/* ============================================================ JOGOS / SCHEDULE */
.phasetabs{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:16px}
.phasetab{border:0; background:none; color:var(--ink-3); font-weight:700; font-size:13.5px; padding:11px 14px;
  white-space:nowrap; border-bottom:2px solid transparent}
.phasetab:hover{color:var(--ink)}
.phasetab.on{color:var(--blue); border-bottom-color:var(--blue)}
.round{margin-bottom:18px}
.round-h{display:flex; align-items:center; gap:9px; margin:0 2px 9px}
.round-h .t{font-size:15px; font-weight:800; letter-spacing:-.01em}
.round-h .lab{font-size:11px; color:var(--ink-3); font-weight:600}
.round-h .break{margin-left:auto; font-size:11px; font-weight:700; color:var(--wine); background:var(--panel-2);
  border:1px solid var(--line); border-radius:999px; padding:3px 10px}
.mgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:11px}
.match{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px 13px; box-shadow:var(--shadow)}
.match.nadal{background:linear-gradient(120deg,rgba(200,135,26,.10),rgba(18,63,214,.05)); border-color:var(--gold)}
.match.empty{opacity:.5; box-shadow:none; border-style:dashed}
.m-top{display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:11px; color:var(--ink-3); font-weight:700}
.court{background:var(--panel-2); border:1px solid var(--line); border-radius:6px; padding:2px 7px; letter-spacing:.02em}
.m-tier{margin-left:auto; font-weight:800; letter-spacing:.03em}
.m-tier.ouro{color:var(--gold)} .m-tier.prata{color:var(--silver)} .m-tier.grupo{color:var(--ink-3)}
.m-row{display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; padding:5px 0}
.m-row .pl{font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.m-row .pl.tbd{color:var(--ink-3); font-style:italic; font-weight:600}
.m-row.win .pl{color:var(--green); font-weight:800}
.scorebox{width:46px; height:38px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
  border-radius:8px; text-align:center; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums}
.scorebox:focus{outline:2px solid var(--brand-soft); border-color:var(--blue)}
.scorebox:disabled{opacity:.6}
.m-vs{text-align:center; font-size:10px; color:var(--ink-3); font-weight:700; letter-spacing:.1em; margin:1px 0}
.nadal-tag{display:inline-flex; align-items:center; gap:6px; font-weight:800; color:var(--gold)}

/* ============================================================ CHAVES / BRACKET */
.bracket-wrap{overflow-x:auto; padding-bottom:8px}
.tier-h{display:flex; align-items:center; gap:10px; margin:6px 2px 14px}
.tier-h .t{font-size:17px; font-weight:800; letter-spacing:-.01em}
.tier-h .badge{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:999px}
.tier-h .badge.ouro{background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold)}
.tier-h .badge.prata{background:var(--silver-soft); color:var(--silver); border:1px solid var(--silver)}
.bracket{display:flex; gap:18px; align-items:stretch; min-width:min-content}
.bcol{display:flex; flex-direction:column; justify-content:space-around; gap:14px; min-width:230px}
.bcol-h{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); margin-bottom:2px; text-align:center}
.bmatch{background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); overflow:hidden}
.bmatch .bm-h{font-size:10px; font-weight:700; color:var(--ink-3); padding:6px 11px 0; letter-spacing:.03em}
.brow{display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; padding:8px 11px}
.brow+.brow{border-top:1px solid var(--line-2)}
.brow .pl{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brow .pl.tbd{color:var(--ink-3); font-style:italic}
.brow.win .pl{color:var(--green); font-weight:800}
.brow .sb{width:40px; height:32px; border:1px solid var(--line); background:var(--panel-2); color:var(--ink);
  border-radius:7px; text-align:center; font-size:15px; font-weight:800}
.brow .sb:disabled{opacity:.55}
.champ{margin-top:10px; padding:13px; border-radius:11px; text-align:center; background:linear-gradient(135deg,var(--gold-soft),transparent); border:1px solid var(--gold)}
.champ.prata{background:linear-gradient(135deg,var(--silver-soft),transparent); border-color:var(--silver)}
.champ .lbl{font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.champ .nm{font-size:18px; font-weight:800; margin-top:3px}
.champ .nm.tbd{color:var(--ink-3); font-style:italic; font-size:14px; font-weight:600}

/* ============================================================ REGRAS */
.rules-hero{display:flex; align-items:center; gap:16px; color:#fff; border-radius:14px; padding:20px 22px; margin:2px 0 20px;
  background:linear-gradient(120deg,#123FD6,#0522A6)}
.rules-hero .rt{font-weight:800; font-size:21px; line-height:1.1}
.rules-hero .rs{color:rgba(255,255,255,.85); font-size:13px; font-weight:500; margin-top:5px; max-width:560px}
.rsec-h{font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-3); margin:24px 2px 12px}
.rules-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px}
.rule-card{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:15px 16px; box-shadow:var(--shadow)}
.rule-card .big{font-weight:800; font-size:26px; color:var(--blue)}
.rule-card.gold .big{color:var(--gold)} .rule-card.silver .big{color:var(--silver)}
.rule-card h4{font-weight:800; margin:4px 0 4px; font-size:14.5px}
.rule-card p{margin:0; color:var(--ink-2); font-size:12.5px; line-height:1.5}
.rtable{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:13px; overflow:hidden; font-size:13.5px; box-shadow:var(--shadow)}
.rtable th,.rtable td{padding:10px 13px; text-align:left; border-bottom:1px solid var(--line-2)}
.rtable th{background:var(--panel-2); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:800}
.rtable td b{color:var(--ink)}
.rtable tr:last-child td{border-bottom:0}
.rules-text{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:16px 18px; color:var(--ink-2); font-size:13.5px; line-height:1.85; box-shadow:var(--shadow)}
.rules-text b{color:var(--ink)}

/* ============================================================ SORTEIO / DRAFT */
.potes-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:18px}
.pote{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden}
.pote-h{display:flex; align-items:center; gap:9px; padding:12px 14px; border-bottom:1px solid var(--line-2); background:var(--panel-2)}
.pote-h .n{width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,var(--blue),var(--navy)); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center}
.pote-h .t{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2)}
.pote-h .pos{margin-left:auto; font-size:10.5px; color:var(--ink-3); font-weight:700}
.pote .inp{width:100%; border:0; border-top:1px solid var(--line-2); background:transparent; color:var(--ink);
  padding:9px 14px; font-size:13.5px; font-weight:600}
.pote .inp:focus{outline:0; background:var(--panel-2)}
.pote .inp.done{color:var(--ink); font-weight:700}
.draft-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
.stage{position:relative; background:linear-gradient(120deg,#0F1738,#0522A6); border-radius:16px; padding:30px 24px; text-align:center; color:#fff; overflow:hidden; min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 12px 40px rgba(5,34,166,.28)}
.stage .eyebrow{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--brand-soft)}
.stage .reveal-name{font-size:32px; font-weight:800; letter-spacing:-.02em; margin:8px 0 4px; min-height:40px; line-height:1.1}
.stage .reveal-name.cycling{color:#D7F171; opacity:.9}
.stage .reveal-dest{font-size:15px; font-weight:700; color:#fff; opacity:0; transition:opacity .3s}
.stage .reveal-dest.show{opacity:1}
.stage .reveal-dest .gtag2{display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:8px; background:#D7F171; color:#0522A6; font-weight:800; margin-left:6px; vertical-align:middle}
.stage .progress{position:absolute; bottom:12px; left:0; right:0; font-size:11px; color:rgba(255,255,255,.6); font-weight:600}
.stage.pop{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.98)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
.mini-groups{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-top:18px}
.mini-g{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:0; overflow:hidden; box-shadow:var(--shadow)}
.mini-g .mh{display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--panel-2); border-bottom:1px solid var(--line-2)}
.mini-g .mh .gtag{width:26px; height:26px; font-size:13px; border-radius:7px}
.mini-g .mh b{font-size:12px; font-weight:800}
.mini-g .slot{display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:13px; border-top:1px solid var(--line-2)}
.mini-g .slot:first-child{border-top:0}
.mini-g .slot .pl{font-weight:600}
.mini-g .slot .pl.tbd{color:var(--ink-3); font-style:italic; font-weight:500}
.mini-g .slot.just{animation:flash 1s ease}
@keyframes flash{0%{background:rgba(215,241,113,.5)}100%{background:transparent}}
.confetti-c{position:fixed; inset:0; pointer-events:none; z-index:80; overflow:hidden; display:none}
.confetti-c.go{display:block}
.conf{position:absolute; top:-20px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(680deg); opacity:.9}}

.toast{position:fixed; bottom:88px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg);
  padding:11px 18px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:.25s; z-index:90}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.empty{padding:26px; text-align:center; color:var(--ink-3); font-size:13.5px; background:var(--panel); border:1px dashed var(--line); border-radius:12px}
.foot{max-width:1200px; margin:0 auto; padding:8px 24px 40px; font-size:11px; color:var(--ink-3)}

@media (max-width:820px){ .bcol{min-width:200px} }
@media (max-width:760px){
  .hdr__in{gap:12px; padding:0 14px}
  .nav{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--panel); border-top:1px solid var(--line);
    justify-content:space-around; gap:0; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); box-shadow:0 -6px 18px rgba(9,26,84,.08)}
  .nav button{flex:1; min-width:0; flex-direction:column; gap:3px; font-size:10px; color:var(--ink-3); padding:6px 2px}
  .nav button .ico{width:19px; height:19px}
  .nav button.on{background:none; color:var(--blue)}
  .word__tag{display:none}
  .wrap{padding:20px 14px 90px}
  .foot{padding:8px 14px 80px}
  .modechip span.lbl{display:none}
}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="hdr">
  <div class="hdr__in">
    <button class="brand" onclick="go('grupos')" aria-label="início">
      <span class="logo-chip"><img src="logo.png" alt="Vinci Compass" onerror="this.closest('.logo-chip').classList.add('fallback')"></span>
      <span class="word">
        <span class="word__name">Vinci Compass <em>Open</em></span>
      </span>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="actions">

<script>
/* ============================================================
   FIREBASE — mesmo padrão do Broslao.
   Cole o firebaseConfig do seu projeto abaixo. Enquanto tiver "COLE_AQUI",
   o app roda em MODO DEMO (salva no navegador via localStorage).
   Regras Firestore sugeridas (torneio de leitura/escrita aberta p/ o grupo):
     match /{document=**} { allow read, write: if true; }   // simples p/ evento interno
   ============================================================ */
const firebaseConfig = {
  apiKey:            "COLE_AQUI",
  authDomain:        "SEU_PROJETO.firebaseapp.com",
  projectId:         "SEU_PROJETO",
  storageBucket:     "SEU_PROJETO.appspot.com",
  messagingSenderId: "COLE_AQUI",
  appId:             "COLE_AQUI"
};
const DEMO = String(firebaseConfig.apiKey).includes("COLE_AQUI");
const LKEY = "tt_state_v1";

/* ============================================================ ESTRUTURA / DADOS FIXOS */
const GROUPS = ["A","B","C","D","E","F"];
const POTE_OF_POS = {1:1,2:2,3:3,4:4}; // posição i no grupo vem do pote i

// Fase de grupos (30 min, 10h–14h30) — com a Taça Nadal 11h–12h numa quadra
const GROUP_SCHEDULE = [
  {time:"10:00", courts:[{g:"B",i:2,j:4},{g:"A",i:1,j:3},{g:"C",i:3,j:4},{g:"E",i:1,j:4},null]},
  {time:"10:30", courts:[{g:"D",i:3,j:4},{g:"A",i:2,j:4},{g:"F",i:1,j:3},{g:"F",i:2,j:4},null]},
  {time:"11:00", courts:[{g:"E",i:2,j:4},{g:"C",i:1,j:4},{g:"B",i:3,j:4},{nadal:true},null]},
  {time:"11:30", courts:[{g:"D",i:2,j:4},{g:"A",i:3,j:4},{g:"D",i:1,j:3},{nadalCont:true},null]},
  {time:"12:00", courts:[{g:"C",i:1,j:3},{g:"E",i:2,j:3},{g:"B",i:1,j:2},{g:"F",i:1,j:2},{g:"C",i:2,j:4}]},
  {time:"12:30", courts:[{g:"D",i:2,j:3},{g:"D",i:1,j:4},{g:"A",i:2,j:3},{g:"A",i:1,j:4},{g:"F",i:3,j:4}]},
  {time:"13:00", courts:[{g:"E",i:1,j:2},{g:"B",i:2,j:3},{g:"E",i:3,j:4},{g:"C",i:1,j:2},{g:"B",i:1,j:4}]},
  {time:"13:30", courts:[{g:"F",i:2,j:3},{g:"A",i:1,j:2},{g:"D",i:1,j:2},{g:"F",i:1,j:4},null]},
  {time:"14:00", courts:[{g:"E",i:1,j:3},{g:"B",i:1,j:3},{g:"C",i:2,j:3},null,null]}
];

// Finais (45 min, 15h–18h) após pausa 14h30–15h
const FINALS_SCHEDULE = [
  {time:"15:00–15:45", courts:["OQF1","OQF2","OQF3","OQF4",null]},
  {time:"15:45–16:30", courts:["OSF1","OSF2","PSF2","PSF1",null]},
  {time:"16:30–17:15", courts:["O3","P3",null,null,null]},
  {time:"17:15–18:00", courts:["OF","PF",null,null,null]}
];

const BRACKET = {
  OQF1:{tier:"ouro", label:"Quartas · Ouro 1", a:{seed:1}, b:{seed:8}},
  OQF2:{tier:"ouro", label:"Quartas · Ouro 2", a:{seed:4}, b:{seed:5}},
  OQF3:{tier:"ouro", label:"Quartas · Ouro 3", a:{seed:3}, b:{seed:6}},
  OQF4:{tier:"ouro", label:"Quartas · Ouro 4", a:{seed:2}, b:{seed:7}},
  OSF1:{tier:"ouro", label:"Semi · Ouro 1", a:{win:"OQF1"}, b:{win:"OQF2"}},
  OSF2:{tier:"ouro", label:"Semi · Ouro 2", a:{win:"OQF3"}, b:{win:"OQF4"}},
  OF:{tier:"ouro", label:"Final · Ouro", a:{win:"OSF1"}, b:{win:"OSF2"}},
  O3:{tier:"ouro", label:"3º lugar · Ouro", a:{lose:"OSF1"}, b:{lose:"OSF2"}},
  PSF1:{tier:"prata", label:"Semi · Prata 1", a:{sil:1}, b:{sil:4}},
  PSF2:{tier:"prata", label:"Semi · Prata 2", a:{sil:2}, b:{sil:3}},
  PF:{tier:"prata", label:"Final · Prata", a:{win:"PSF1"}, b:{win:"PSF2"}},
  P3:{tier:"prata", label:"3º lugar · Prata", a:{lose:"PSF1"}, b:{lose:"PSF2"}}
};

const NAV = [
  {id:"sorteio",   label:"Sorteio",       ico:'<path d="M4 4h6v6H4zM14 14h6v6h-6z"/><path d="M8 14h.01M6 16h.01M8 18h.01M16 6h.01M18 8h.01M16 8h.01"/>'},
  {id:"grupos",    label:"Grupos",        ico:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>'},
  {id:"classificacao", label:"Classificação", ico:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'},
  {id:"jogos",     label:"Jogos",         ico:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'},
  {id:"chaves",    label:"Chaves",        ico:'<path d="M6 3v6a3 3 0 0 0 3 3h6a3 3 0 0 1 3 3v6M6 21v-6"/>'},
  {id:"regras",    label:"Regras",        ico:'<path d="M4 5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 3v5h5"/>'}
];

/* ============================================================ ESTADO */
function defaultState(){
  const potes={}; for(let p=1;p<=4;p++) potes[p]=["","","","","",""];
  const groups={}; GROUPS.forEach(g=> groups[g]=[null,null,null,null]);
  return { potes, groups, drawDone:false, results:{}, finals:{}, nadal:{a:"",b:"",ra:null,rb:null} };
}
let S = defaultState();
let VIEW = "grupos";
let PHASE = "grupos"; // aba dentro de Jogos

/* ============================================================ PERSISTÊNCIA (Firebase ou local) */
let DBH = null;
function persist(){
  if(DEMO){ try{ localStorage.setItem(LKEY, JSON.stringify(S)); }catch(e){} }
  else if(DBH){ DBH.collection("torneio").doc("estado").set(S, {merge:false}).catch(e=>toast("Erro ao salvar: "+e.message)); }
}
function initData(){
  if(DEMO){
    try{ const raw=localStorage.getItem(LKEY); if(raw) S=Object.assign(defaultState(), JSON.parse(raw)); }catch(e){}
    render();
  } else {
    firebase.initializeApp(firebaseConfig);
    DBH = firebase.firestore();
    DBH.collection("torneio").doc("estado").onSnapshot(doc=>{
      if(doc.exists){ S=Object.assign(defaultState(), doc.data()); }
      render();
    }, err=>{ toast("Firestore: "+err.message); render(); });
  }
}

/* ============================================================ HELPERS DE JOGO */
const $ = (s,el=document)=> el.querySelector(s);
function name(g,pos){ const v=S.groups[g] && S.groups[g][pos-1]; return v || (g+pos); }
function isNamed(g,pos){ return !!(S.groups[g] && S.groups[g][pos-1]); }
function mid(g,i,j){ return "G-"+g+"-"+i+"-"+j; }

function groupPairs(){ return [[1,2],[3,4],[1,3],[2,4],[1,4],[2,3]]; }

function computeGroup(g){
  const st={}; for(let p=1;p<=4;p++) st[p]={pos:p, name:name(g,p), w:0, gw:0, gl:0, played:0};
  groupPairs().forEach(([i,j])=>{
    const r=S.results[mid(g,i,j)];
    if(r && r.a!=null && r.b!=null && r.a!=="" && r.b!==""){
      const a=+r.a, b=+r.b;
      st[i].gw+=a; st[i].gl+=b; st[j].gw+=b; st[j].gl+=a; st[i].played++; st[j].played++;
      if(a>b) st[i].w++; else if(b>a) st[j].w++;
    }
  });
  Object.values(st).forEach(x=> x.saldo=x.gw-x.gl);
  const h2h=(x,y)=>{ // 1 se x venceu y, -1 se y venceu x, 0 indefinido
    for(const [i,j] of groupPairs()){
      if((i===x&&j===y)||(i===y&&j===x)){
        const r=S.results[mid(g,Math.min(i,j),Math.max(i,j))];
        if(!r||r.a==null||r.b==null||r.a===""||r.b==="") return 0;
        const lo=Math.min(i,j), a=+r.a,b=+r.b;
        const winnerPos = a>b?lo:(b>a?Math.max(i,j):0);
        if(!winnerPos) return 0;
        return winnerPos===x?1:-1;
      }
    }
    return 0;
  };
  let arr=[1,2,3,4].sort((a,b)=> st[b].w-st[a].w);
  const out=[]; let k=0;
  while(k<arr.length){
    let m=k; while(m+1<arr.length && st[arr[m+1]].w===st[arr[k]].w) m++;
    let cl=arr.slice(k,m+1);
    if(cl.length===2){
      const hh=h2h(cl[0],cl[1]);
      if(hh!==0) cl = hh>0?[cl[0],cl[1]]:[cl[1],cl[0]];
      else cl.sort((a,b)=> st[b].saldo-st[a].saldo || st[a].gl-st[b].gl);
    } else if(cl.length>2){
      cl.sort((a,b)=> st[b].saldo-st[a].saldo || st[a].gl-st[b].gl);
      for(let z=0;z<cl.length-1;z++){
        if(st[cl[z]].saldo===st[cl[z+1]].saldo && st[cl[z]].gl===st[cl[z+1]].gl){
          if(h2h(cl[z],cl[z+1])<0){ const t=cl[z]; cl[z]=cl[z+1]; cl[z+1]=t; }
        }
      }
    }
    out.push(...cl); k=m+1;
  }
  return out.map((pos,i)=> ({...st[pos], rank:i+1}));
}
function groupComplete(g){ return groupPairs().every(([i,j])=>{ const r=S.results[mid(g,i,j)]; return r&&r.a!=null&&r.b!=null&&r.a!==""&&r.b!==""; }); }
function allGroupsComplete(){ return GROUPS.every(groupComplete); }

let _seedCache=null, _seedKey=null;
function seeding(){
  const key=JSON.stringify(S.results);
  if(_seedKey===key) return _seedCache;
  _seedKey=key;
  if(!allGroupsComplete()){ _seedCache=null; return null; }
  const winners=[], runners=[];
  GROUPS.forEach(g=>{ const r=computeGroup(g); winners.push({...r[0], g}); runners.push({...r[1], g}); });
  const cmp=(x,y)=> y.w-x.w || y.saldo-x.saldo || x.gl-y.gl || x.g.localeCompare(y.g);
  winners.sort(cmp);
  const rs=[...runners].sort(cmp);
  const best2=rs.slice(0,2), rest4=rs.slice(2);
  const gold=[null].concat(winners.slice(0,6)); // gold[1..6]
  gold[7]=best2[0]; gold[8]=best2[1];
  // anti-reencontro: seed8 enfrenta seed1 (QF1); seed7 enfrenta seed2 (QF4)
  if((gold[8]&&gold[1]&&gold[8].g===gold[1].g) || (gold[7]&&gold[2]&&gold[7].g===gold[2].g)){
    const t=gold[7]; gold[7]=gold[8]; gold[8]=t;
  }
  const silver=[null].concat(rest4); // silver[1..4]
  _seedCache={gold, silver}; return _seedCache;
}

function resolveRef(ref){
  const sd=seeding();
  if(ref.seed!=null){ return sd? sd.gold[ref.seed] : null; }
  if(ref.sil!=null){ return sd? sd.silver[ref.sil] : null; }
  if(ref.win!=null){ return winnerOf(ref.win); }
  if(ref.lose!=null){ return loserOf(ref.lose); }
  return null;
}
function bracketPlayers(slot){
  const b=BRACKET[slot];
  return { a:resolveRef(b.a), b:resolveRef(b.b) };
}
function winnerOf(slot){
  const p=bracketPlayers(slot), r=S.finals[slot];
  if(!p.a||!p.b||!r||r.a==null||r.b==null||r.a===""||r.b===""||+r.a===+r.b) return null;
  return (+r.a>+r.b)? p.a : p.b;
}
function loserOf(slot){
  const p=bracketPlayers(slot), r=S.finals[slot];
  if(!p.a||!p.b||!r||r.a==null||r.b==null||r.a===""||r.b===""||+r.a===+r.b) return null;
  return (+r.a>+r.b)? p.b : p.a;
}
function pname(pl){ return pl? (pl.name || (pl.g+(pl.rank||""))) : null; }

/* ============================================================ RENDER: NAV + ROTA */
function renderNav(){
  $("#nav").innerHTML = NAV.map(n=>`<button class="${VIEW===n.id?'on':''}" onclick="go('${n.id}')">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${n.ico}</svg>
    <span>${n.label}</span></button>`).join("");
}
function go(v){ VIEW=v; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function render(){
  renderNav();
  const app=$("#app");
  if(VIEW==="sorteio") app.innerHTML=renderSorteio();
  else if(VIEW==="grupos") app.innerHTML=renderGrupos();
  else if(VIEW==="classificacao") app.innerHTML=renderClassificacao();
  else if(VIEW==="jogos") app.innerHTML=renderJogos();
  else if(VIEW==="chaves") app.innerHTML=renderChaves();
  else if(VIEW==="regras") app.innerHTML=renderRegras();
  const mc=$("#modechip");
  mc.className="modechip"+(DEMO?" demo":"");
  mc.querySelector(".lbl").textContent = DEMO? "modo demo" : "ao vivo";
  $("#foot").innerHTML = (DEMO
    ? "Modo demonstração — dados salvos só neste navegador. Cole seu <b>firebaseConfig</b> no topo do arquivo para ativar o placar ao vivo (Firestore), como no Broslão."
    : "Placar ao vivo via Firebase/Firestore. ") + " · Formatação: RadarPE · Estrutura: BROS.lão · 24 jogadores · 6 grupos de 4.";
}

/* ============================================================ GRUPOS */
function renderGrupos(){
  const secs=GROUPS.map(g=>{
    const st=computeGroup(g);
    const rows=[1,2,3,4].map(pos=>{
      const named=isNamed(g,pos);
      const s=st.find(x=>x.pos===pos);
      const rec = s && s.played>0 ? `${s.w}V · ${s.saldo>=0?'+':''}${s.saldo} games` : "—";
      return `<div class="r">
        <span class="pote-badge">P${POTE_OF_POS[pos]}</span>
        <span class="pl ${named?'':'tbd'}">${named?name(g,pos):('à definir · '+g+pos)}</span>
        <span class="rec num">${rec}</span></div>`;
    }).join("");
    return `<div class="groupsec">
      <div class="group-h"><span class="gtag">${g}</span><h3>Grupo ${g}</h3><span class="meta">round-robin · 3 jogos por atleta</span></div>
      <div class="gcards"><div class="card"><div class="roster">${rows}</div></div></div>
    </div>`;
  }).join("");
  return `<div class="page-head">
      <div><h1>Grupos</h1><p>Seis grupos de quatro. As vagas A1–F4 são preenchidas pelo sorteio por potes. Cada atleta joga 3 partidas (set de 4 games).</p></div>
      <div class="stamp">${S.drawDone?'Sorteio realizado':'Aguardando sorteio'}</div>
    </div>${secs}`;
}

/* ============================================================ CLASSIFICAÇÃO */
function renderClassificacao(){
  const sd=seeding();
  const qtag=(g,pos)=>{
    if(pos===1) return `<span class="qbadge ouro">Ouro</span>`;
    if(pos===2){
      if(!sd) return `<span class="qbadge tbd">2º</span>`;
      const inGold = sd.gold.slice(7).some(p=>p&&p.g===g);
      return inGold? `<span class="qbadge ouro">Ouro</span>` : `<span class="qbadge prata">Prata</span>`;
    }
    return "";
  };
  const secs=GROUPS.map(g=>{
    const st=computeGroup(g), any=st.some(x=>x.played>0);
    const rows=st.map(r=>`<tr class="${r.rank===1?'q1':r.rank===2?'q2':''}">
      <td class="pos">${r.rank}</td>
      <td class="l name">${isNamed(g,r.pos)?r.name:(g+r.pos)}${r.rank<=2?qtag(g,r.rank):''}</td>
      <td class="pp num">${r.w}</td><td class="num">${r.played}</td>
      <td class="num">${r.gw}</td><td class="num">${r.gl}</td>
      <td class="num">${r.saldo>0?'+':''}${r.saldo}</td></tr>`).join("");
    return `<div class="groupsec">
      <div class="group-h"><span class="gtag">${g}</span><h3>Grupo ${g}</h3><span class="meta">${any?'parcial ao vivo':'sem resultados'}</span></div>
      <div class="card"><table class="gt">
        <thead><tr><th></th><th class="l">Atleta</th><th>V</th><th>J</th><th>GP</th><th>GC</th><th>Saldo</th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>`;
  }).join("");
  const status = allGroupsComplete()
    ? `<div class="banner"><span>✅ <b>Fase de grupos concluída.</b> Chaves Ouro e Prata montadas automaticamente na aba <b>Chaves</b>.</span></div>`
    : `<div class="banner"><span>Classificação atualiza ao vivo conforme os placares são inseridos na aba <b>Jogos</b>. Critérios de desempate na aba <b>Regras</b>.</span></div>`;

  // Classificação entre os 2º colocados — define as 2 últimas vagas da Ouro e a Prata
  const runners = GROUPS.map(g=>{ const r=computeGroup(g); return {...r[1], g}; })
    .sort((x,y)=> y.w-x.w || y.saldo-x.saldo || x.gl-y.gl || x.g.localeCompare(y.g));
  const rrRows = runners.map((r,idx)=>{
    const dest = idx<2 ? 'ouro' : 'prata';
    const named = isNamed(r.g, r.pos);
    const cut = idx===2 ? ' style="border-top:2px dashed var(--gold)"' : '';
    return `<tr class="${idx<2?'q1':'q2'}">
      <td class="pos"${cut}>${idx+1}</td>
      <td class="l name"${cut}>${named?r.name:(r.g+r.pos)} <span class="pote-badge">Grupo ${r.g}</span></td>
      <td class="pp num"${cut}>${r.w}</td>
      <td class="num"${cut}>${r.saldo>0?'+':''}${r.saldo}</td>
      <td class="num"${cut}>${r.gl}</td>
      <td${cut}><span class="qbadge ${dest}">${dest==='ouro'?'QF Ouro':'SF Prata'}</span></td></tr>`;
  }).join("");
  const runnersSection = `<div class="groupsec" style="margin-top:8px">
    <div class="group-h"><span class="gtag" style="background:linear-gradient(135deg,var(--gold),var(--gold-deep,#9c6a12))">2º</span>
      <h3>Classificação dos 2º colocados</h3><span class="meta">${allGroupsComplete()?'definida':'parcial'} · define Ouro × Prata</span></div>
    <div class="banner"><span>Os <b>2 melhores 2º</b> completam a <b>Chave Ouro</b> (vão às quartas); os <b>outros 4</b> vão para a <b>Chave Prata</b> (semifinais). Critério entre grupos: <b>vitórias → saldo de games → games perdidos</b>.${allGroupsComplete()?'':' Enquanto os grupos não terminam, esta ordem é <b>provisória</b>.'}</span></div>
    <div class="card"><table class="gt">
      <thead><tr><th></th><th class="l">2º colocado</th><th>V</th><th>Saldo</th><th>GC</th><th>Destino</th></tr></thead>
      <tbody>${rrRows}</tbody></table></div></div>`;

  return `<div class="page-head"><div><h1>Classificação</h1><p>Ordenação por vitórias, confronto direto (empate de 2), saldo de games e games perdidos. 1º + 2 melhores 2º → Ouro; demais 2º → Prata.</p></div>
    <div class="stamp">GP = games pró · GC = games contra</div></div>${status}${secs}${runnersSection}`;
}

/* ============================================================ JOGOS / SCHEDULE */
function scoreInput(kind, id, side, val){
  const v = val==null?"":val;
  return `<input class="scorebox num" inputmode="numeric" maxlength="2" value="${v}"
    onchange="setScore('${kind}','${id}','${side}',this.value)" aria-label="games ${side}">`;
}
function groupMatchCard(entry, court){
  if(!entry) return `<div class="match empty"><div class="m-top"><span class="court">Quadra ${court}</span><span class="m-tier grupo">livre</span></div><div class="m-vs">— sem jogo —</div></div>`;
  if(entry.nadalCont){
    return `<div class="match nadal"><div class="m-top"><span class="court">Quadra ${court}</span><span class="m-tier ouro">🎾 Especial</span></div>
      <div class="m-vs" style="margin-top:14px">🎾 TAÇA NADAL</div>
      <div style="text-align:center;font-size:11.5px;color:var(--ink-3);font-weight:600;padding:6px 0 2px">jogo único de 1h · em andamento (11h–12h)</div></div>`;
  }
  if(entry.nadal){
    const n=S.nadal;
    return `<div class="match nadal"><div class="m-top"><span class="court">Quadra ${court}</span><span class="m-tier ouro">🎾 Especial · 1h (11h–12h)</span></div>
      <div class="m-row"><input class="scorebox" style="width:auto;flex:1;text-align:left;padding:0 10px;font-size:13px;font-weight:600" placeholder="Jogador 1" value="${n.a||''}" onchange="setNadal('a',this.value)">
        ${scoreInput('nadal','x','ra',n.ra)}</div>
      <div class="m-vs">TAÇA NADAL</div>
      <div class="m-row"><input class="scorebox" style="width:auto;flex:1;text-align:left;padding:0 10px;font-size:13px;font-weight:600" placeholder="Jogador 2" value="${n.b||''}" onchange="setNadal('b',this.value)">
        ${scoreInput('nadal','x','rb',n.rb)}</div></div>`;
  }
  const {g,i,j}=entry, id=mid(g,i,j), r=S.results[id]||{};
  const a=r.a, b=r.b, aw=(a!=null&&b!=null&&a!==""&&b!==""&&+a>+b), bw=(a!=null&&b!=null&&a!==""&&b!==""&&+b>+a);
  return `<div class="match"><div class="m-top"><span class="court">Quadra ${court}</span><span class="gtag" style="width:22px;height:22px;font-size:11px;border-radius:6px">${g}</span><span class="m-tier grupo">Grupo ${g}</span></div>
    <div class="m-row ${aw?'win':''}"><span class="pl ${isNamed(g,i)?'':'tbd'}">${name(g,i)}</span>${scoreInput('group',id,'a',a)}</div>
    <div class="m-vs">SET 4 GAMES</div>
    <div class="m-row ${bw?'win':''}"><span class="pl ${isNamed(g,j)?'':'tbd'}">${name(g,j)}</span>${scoreInput('group',id,'b',b)}</div></div>`;
}
function bracketMatchCardSchedule(slot, court){
  if(!slot) return `<div class="match empty"><div class="m-top"><span class="court">Quadra ${court}</span></div><div class="m-vs">— sem jogo —</div></div>`;
  const b=BRACKET[slot], p=bracketPlayers(slot), r=S.finals[slot]||{};
  const na=pname(p.a), nb=pname(p.b);
  const a=r.a,bb=r.b, aw=(a!=null&&bb!=null&&a!==""&&bb!==""&&+a>+bb), bw=(a!=null&&bb!=null&&a!==""&&bb!==""&&+bb>+a);
  return `<div class="match"><div class="m-top"><span class="court">Quadra ${court}</span><span class="m-tier ${b.tier}">${b.tier==='ouro'?'Ouro':'Prata'}</span></div>
    <div class="m-row ${aw?'win':''}"><span class="pl ${na?'':'tbd'}">${na||'a definir'}</span>${scoreInput('final',slot,'a',a)}</div>
    <div class="m-vs">${b.label.toUpperCase()}</div>
    <div class="m-row ${bw?'win':''}"><span class="pl ${nb?'':'tbd'}">${nb||'a definir'}</span>${scoreInput('final',slot,'b',bb)}</div></div>`;
}
function renderJogos(){
  const tabs=`<div class="phasetabs">
    <button class="phasetab ${PHASE==='grupos'?'on':''}" onclick="setPhase('grupos')">Fase de grupos</button>
    <button class="phasetab ${PHASE==='finais'?'on':''}" onclick="setPhase('finais')">Fases finais</button></div>`;
  let body="";
  if(PHASE==="grupos"){
    body=GROUP_SCHEDULE.map((rnd,idx)=>{
      const cards=rnd.courts.map((c,ci)=> groupMatchCard(c, ci+1)).join("");
      const isLast = idx===GROUP_SCHEDULE.length-1;
      return `<div class="round"><div class="round-h"><span class="t num">${rnd.time}</span><span class="lab">rodada ${idx+1}</span>${isLast?'<span class="break">pausa 14h30–15h00</span>':''}</div>
        <div class="mgrid">${cards}</div></div>`;
    }).join("");
  } else {
    const note = allGroupsComplete()? "" : `<div class="banner"><span>Os confrontos vão sendo preenchidos automaticamente conforme a fase de grupos termina. Você já pode inserir placares assim que os nomes aparecerem.</span></div>`;
    body=note+FINALS_SCHEDULE.map(rnd=>{
      const cards=rnd.courts.map((c,ci)=> bracketMatchCardSchedule(c, ci+1)).join("");
      return `<div class="round"><div class="round-h"><span class="t num">${rnd.time}</span><span class="lab">45 min · set completo</span></div>
        <div class="mgrid">${cards}</div></div>`;
    }).join("");
  }
  return `<div class="page-head"><div><h1>Jogos</h1><p>Placar por quadra e horário. Insira os games de cada set — a classificação e as chaves atualizam sozinhas${DEMO?'':' e sincronizam ao vivo'}.</p></div>
    <div class="stamp">5 quadras · 30 min (grupos) / 45 min (finais)</div></div>${tabs}${body}`;
}
function setPhase(p){ PHASE=p; render(); }

/* ============================================================ CHAVES / BRACKET */
function brow(slot, side){
  const b=BRACKET[slot], p=bracketPlayers(slot), r=S.finals[slot]||{};
  const pl = side==='a'? p.a : p.b;
  const nm = pname(pl);
  const val = side==='a'? r.a : r.b;
  const other = side==='a'? r.b : r.a;
  const win = (val!=null&&other!=null&&val!==""&&other!==""&&+val>+other);
  return `<div class="brow ${win?'win':''}"><span class="pl ${nm?'':'tbd'}">${nm||'a definir'}</span>
    <input class="sb num" inputmode="numeric" maxlength="2" value="${val==null?'':val}" onchange="setScore('final','${slot}','${side}',this.value)"></div>`;
}
function bmatch(slot){
  const b=BRACKET[slot];
  return `<div class="bmatch"><div class="bm-h">${b.label}</div>${brow(slot,'a')}${brow(slot,'b')}</div>`;
}
function renderChaves(){
  const sd=seeding();
  const gate = sd? "" : `<div class="banner"><span>🔒 As chaves são semeadas automaticamente quando <b>todos os grupos terminarem</b>. Os cabeças de chave 1–6 saem dos líderes; 7–8 dos dois melhores 2º. Enquanto isso, os confrontos aparecem como "a definir".</span></div>`;
  const goldChamp=winnerOf("OF"), silverChamp=winnerOf("PF");
  const ouro=`<div class="tier-h"><span class="t">Chave Ouro</span><span class="badge ouro">8 atletas · quartas</span></div>
    <div class="bracket-wrap"><div class="bracket">
      <div class="bcol"><div class="bcol-h">Quartas</div>${bmatch("OQF1")}${bmatch("OQF2")}${bmatch("OQF3")}${bmatch("OQF4")}</div>
      <div class="bcol"><div class="bcol-h">Semifinais</div>${bmatch("OSF1")}${bmatch("OSF2")}</div>
      <div class="bcol"><div class="bcol-h">Final &amp; 3º</div>${bmatch("OF")}${bmatch("O3")}
        <div class="champ"><div class="lbl">Campeão Ouro</div><div class="nm ${goldChamp?'':'tbd'}">${goldChamp?pname(goldChamp):'a definir'}</div></div></div>
    </div></div>`;
  const prata=`<div class="tier-h" style="margin-top:26px"><span class="t">Chave Prata</span><span class="badge prata">4 atletas · semifinais</span></div>
    <div class="bracket-wrap"><div class="bracket">
      <div class="bcol"><div class="bcol-h">Semifinais</div>${bmatch("PSF1")}${bmatch("PSF2")}</div>
      <div class="bcol"><div class="bcol-h">Final &amp; 3º</div>${bmatch("PF")}${bmatch("P3")}
        <div class="champ prata"><div class="lbl">Campeão Prata</div><div class="nm ${silverChamp?'':'tbd'}">${silverChamp?pname(silverChamp):'a definir'}</div></div></div>
    </div></div>`;
  return `<div class="page-head"><div><h1>Chaves</h1><p>Mata-mata de sets completos. Vencedores avançam automaticamente conforme os placares são lançados.</p></div>
    <div class="stamp">QF 1×8 · 4×5 · 3×6 · 2×7</div></div>${gate}${ouro}${prata}`;
}

/* ============================================================ REGRAS */
function renderRegras(){
  return `<div class="rules-hero"><div><div class="rt">Regulamento</div>
    <div class="rs">24 atletas, 6 grupos de 4. Fase de grupos em sets de 4 games (no-ad); fases finais em sets completos. Duas chaves no mata-mata: Ouro e Prata.</div></div></div>

    <div class="rsec-h">Formato</div>
    <div class="rules-grid">
      <div class="rule-card"><div class="big">6×4</div><h4>Grupos</h4><p>Seis grupos de quatro, todos contra todos. Cada atleta joga 3 partidas na fase de grupos.</p></div>
      <div class="rule-card"><div class="big">4</div><h4>Set curto (grupos)</h4><p>Set de 4 games, no-ad. ~30 min por jogo. 36 jogos das 10h às 14h30.</p></div>
      <div class="rule-card gold"><div class="big">8</div><h4>Chave Ouro</h4><p>6 líderes de grupo + os 2 melhores 2º colocados. Começa nas quartas de final.</p></div>
      <div class="rule-card silver"><div class="big">4</div><h4>Chave Prata</h4><p>Os outros 4 segundos colocados. Começa nas semifinais.</p></div>
    </div>

    <div class="rsec-h">Classificação — critérios de desempate</div>
    <table class="rtable">
      <thead><tr><th style="width:34px">#</th><th>Critério</th><th>Observação</th></tr></thead>
      <tbody>
        <tr><td><b>1</b></td><td>Número de vitórias</td><td>Partidas ganhas nos 3 jogos do grupo.</td></tr>
        <tr><td><b>2</b></td><td>Confronto direto (empate de 2)</td><td>Quem venceu o jogo entre os dois.</td></tr>
        <tr><td><b>3</b></td><td>Saldo de games</td><td>Games ganhos − games perdidos no grupo.</td></tr>
        <tr><td><b>4</b></td><td>Menor nº de games perdidos</td><td>Equivale a maior % de games ganhos.</td></tr>
        <tr><td><b>5</b></td><td>Sorteio</td><td>Se restarem 2 empatados, reaplica-se o confronto direto antes do sorteio.</td></tr>
      </tbody>
    </table>

    <div class="rsec-h">Avanço e chaveamento</div>
    <div class="rules-text">
      Sobem <b>2 por grupo</b>: o líder e o vice. Os <b>6 líderes</b> e os <b>2 melhores 2º colocados</b> formam a <b>Chave Ouro</b> (8, quartas de final). Os <b>outros 4 segundos</b> vão para a <b>Chave Prata</b> (4, semifinais).<br>
      Para eleger os 2 melhores 2º e ordenar os cabeças, compara-se entre grupos por <b>vitórias → saldo de games → games perdidos</b> (todos jogaram 3 partidas, então a comparação é direta).<br>
      Semeadura da Ouro: cabeças 1–6 são os líderes ordenados; 7–8 são os dois 2º classificados. Quartas: <b>1×8, 4×5, 3×6, 2×7</b>. Regra anti-reencontro: se um 2º cairia contra o líder do próprio grupo, invertem-se os cabeças 7 e 8.
    </div>

    <div class="rsec-h">Agenda</div>
    <div class="rules-text">
      <b>10h00–14h30</b> — fase de grupos (5 quadras; a 5ª entra às 12h). <b>Taça Nadal</b> às <b>11h–12h</b> em uma quadra (jogo especial).<br>
      <b>14h30–15h00</b> — pausa. <b>15h00–18h00</b> — mata-mata (Ouro e Prata), sets completos de 45 min. Final Ouro às 17h15.
    </div>`;
}

/* ============================================================ SORTEIO / DRAFT */
let draftPlan=null, draftIdx=0, draftAnimating=false;
function renderSorteio(){
  const potesHtml=[1,2,3,4].map(p=>{
    const filled=S.potes[p].filter(x=>x&&x.trim()).length;
    const inputs=S.potes[p].map((nm,i)=>`<input class="inp ${S.drawDone?'done':''}" ${S.drawDone?'disabled':''} placeholder="Atleta ${i+1}" value="${(nm||'').replace(/"/g,'&quot;')}" onchange="setPote(${p},${i},this.value)">`).join("");
    return `<div class="pote"><div class="pote-h"><span class="n">${p}</span><span class="t">Pote ${p}</span><span class="pos">→ posição ${p} · ${filled}/6</span></div>${inputs}</div>`;
  }).join("");
  const total=[1,2,3,4].reduce((a,p)=>a+S.potes[p].filter(x=>x&&x.trim()).length,0);
  const ready = [1,2,3,4].every(p=>S.potes[p].filter(x=>x&&x.trim()).length===6);

  const stage = `<div class="stage" id="stage">
      <div class="eyebrow">${S.drawDone?'Sorteio concluído':'Sorteio dos grupos'}</div>
      <div class="reveal-name" id="revealName">${S.drawDone?'🎾 Grupos definidos':'Pronto para sortear'}</div>
      <div class="reveal-dest ${S.drawDone?'show':''}" id="revealDest">${S.drawDone?'Um atleta de cada pote por grupo':''}</div>
      <div class="progress" id="revealProg">${total}/24 atletas cadastrados</div>
    </div>`;

  const mini=`<div class="mini-groups">`+GROUPS.map(g=>{
    const slots=[1,2,3,4].map(pos=>{
      const nm=S.groups[g][pos-1];
      return `<div class="slot" data-g="${g}" data-pos="${pos}"><span class="pote-badge">P${pos}</span><span class="pl ${nm?'':'tbd'}">${nm||('· '+g+pos)}</span></div>`;
    }).join("");
    return `<div class="mini-g"><div class="mh"><span class="gtag">${g}</span><b>Grupo ${g}</b></div>${slots}</div>`;
  }).join("")+`</div>`;

  const bar = S.drawDone
    ? `<div class="draft-bar"><button class="btn ghost" onclick="redoDraw()">↺ Refazer sorteio</button>
        <span style="font-size:12.5px;color:var(--ink-3)">Os nomes já substituem A1–F4 em todo o torneio.</span></div>`
    : `<div class="draft-bar">
        <button class="btn primary" id="btnNext" ${ready?'':'disabled'} onclick="draftNext()">🎲 Sortear próximo</button>
        <button class="btn" id="btnAuto" ${ready?'':'disabled'} onclick="draftAll()">⏩ Sortear tudo</button>
        <button class="btn ghost" onclick="fillSample()">Preencher exemplo</button>
        ${ready?'':'<span style="font-size:12.5px;color:var(--ink-3)">Preencha 6 nomes em cada pote para liberar o sorteio.</span>'}
      </div>`;

  return `<div class="page-head"><div><h1>Sorteio</h1><p>Divida os 24 atletas em 4 potes de 6 (por nível/força). O sorteio coloca <b>um atleta de cada pote em cada grupo</b> — e os nomes passam a valer em toda a tabela.</p></div>
    <div class="stamp">4 potes × 6 · 1 por pote por grupo</div></div>
    ${bar}${stage}${ S.drawDone?'' : '<div class="rsec-h">Potes</div>'+`<div class="potes-grid">${potesHtml}</div>`}
    <div class="rsec-h">Grupos</div>${mini}`;
}
function setPote(p,i,v){ S.potes[p][i]=v.trim(); persist(); render(); }
function fillSample(){
  const first=["Rafa","Nova","Bru","Duda","Léo","Tati","Gui","Mari","Théo","Ana","Caio","Bia","Igor","Lara","Vini","Nina","Zeca","Sofi","Pipo","Manu","Dado","Cleo","Rui","Tuca"];
  let k=0; for(let p=1;p<=4;p++) for(let i=0;i<6;i++) S.potes[p][i]=first[k++];
  persist(); render(); toast("Nomes de exemplo preenchidos.");
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildPlan(){
  const plan=[];
  for(let p=1;p<=4;p++){
    const names=shuffle(S.potes[p].slice()), grps=shuffle(GROUPS.slice());
    grps.forEach((g,idx)=> plan.push({pote:p, name:names[idx], group:g}));
  }
  return plan;
}
function ensurePlan(){
  if(!draftPlan){ draftPlan=buildPlan(); draftIdx=0; }
}
function commitReveal(item){
  S.groups[item.group][item.pote-1]=item.name;
  // marca slot recém-preenchido
  const stage=$("#stage"); if(stage) stage.classList.add("pop");
  persist();
  // atualização leve do mini-grid sem re-render total (mantém animação)
  const slot=document.querySelector(`.mini-g .slot[data-g="${item.group}"][data-pos="${item.pote}"]`);
  if(slot){ slot.classList.add("just"); const pl=slot.querySelector(".pl"); pl.textContent=item.name; pl.classList.remove("tbd"); }
}
function draftNext(cb){
  if(draftAnimating) return;
  ensurePlan();
  if(draftIdx>=draftPlan.length){ finishDraw(); if(cb)cb(); return; }
  const item=draftPlan[draftIdx];
  const nameEl=$("#revealName"), destEl=$("#revealDest"), progEl=$("#revealProg");
  if(!nameEl||!destEl||!progEl){ if(cb)cb(); return; }
  draftAnimating=true;
  const btnN=$("#btnNext"), btnA=$("#btnAuto"); if(btnN)btnN.disabled=true; if(btnA)btnA.disabled=true;
  destEl.classList.remove("show"); nameEl.classList.add("cycling");
  // nomes ainda não revelados desse pote para "girar"
  const pool=draftPlan.filter(x=>x.pote===item.pote).map(x=>x.name);
  let ticks=0; const maxT=16;
  const spin=setInterval(()=>{
    nameEl.textContent = pool[Math.floor(Math.random()*pool.length)];
    ticks++;
    if(ticks>=maxT){
      clearInterval(spin);
      nameEl.classList.remove("cycling");
      nameEl.textContent=item.name;
      destEl.innerHTML=`vai para o <b>Grupo</b> <span class="gtag2">${item.group}</span>`;
      destEl.classList.add("show");
      commitReveal(item);
      draftIdx++;
      progEl.textContent = `${draftIdx}/24 sorteados`;
      setTimeout(()=>{
        draftAnimating=false;
        if(btnN)btnN.disabled=false; if(btnA)btnA.disabled=false;
        if(draftIdx>=draftPlan.length) finishDraw();
        if(cb) cb();
      }, 420);
    }
  }, 55);
}
function draftAll(){
  ensurePlan();
  while(draftIdx<draftPlan.length){ const it=draftPlan[draftIdx]; S.groups[it.group][it.pote-1]=it.name; draftIdx++; }
  finishDraw();
}
function finishDraw(){
  if(S.drawDone) return;
  S.drawDone=true; persist();
  const nameEl=$("#revealName"), destEl=$("#revealDest");
  if(nameEl) nameEl.textContent="🏆 Grupos definidos!";
  if(destEl){ destEl.innerHTML="Boa sorte a todos"; destEl.classList.add("show"); }
  confetti();
  setTimeout(()=>{ toast("Sorteio concluído! Nomes aplicados em todo o torneio."); render(); }, 1200);
}
function redoDraw(){
  if(!confirm("Refazer o sorteio? Isso limpa a alocação atual dos grupos (os nomes dos potes são mantidos).")) return;
  GROUPS.forEach(g=> S.groups[g]=[null,null,null,null]);
  S.drawDone=false; draftPlan=null; draftIdx=0; persist(); render();
}
function confetti(){
  const c=$("#confetti"); c.innerHTML=""; c.classList.add("go");
  const cols=["#123FD6","#00AEEF","#6DBE45","#C8871A","#D7F171","#2FA98E"];
  for(let i=0;i<90;i++){
    const d=document.createElement("div"); d.className="conf";
    d.style.left=Math.random()*100+"%"; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.6+Math.random()*1.6)+"s"; d.style.animationDelay=(Math.random()*.5)+"s";
    c.appendChild(d);
  }
  setTimeout(()=>{ c.classList.remove("go"); c.innerHTML=""; }, 3600);
}

/* ============================================================ SETTERS DE PLACAR */
function setScore(kind,id,side,val){
  const v=val.trim()===""?null:Math.max(0,Math.min(20,parseInt(val,10)||0));
  if(kind==="group"){ if(!S.results[id]) S.results[id]={a:null,b:null}; S.results[id][side]=v; }
  else if(kind==="final"){ if(!S.finals[id]) S.finals[id]={a:null,b:null}; S.finals[id][side]=v; }
  else if(kind==="nadal"){ S.nadal[side]=v; }
  persist(); render();
}
function setNadal(side,val){ S.nadal[side]=val.trim(); persist(); }

/* ============================================================ MENU / EXPORT / TEMA */
function toggleTheme(){
  const el=document.documentElement, cur=el.dataset.theme;
  if(cur==="dark"){ delete el.dataset.theme; try{localStorage.setItem("tt_theme","light")}catch(e){} }
  else { el.dataset.theme="dark"; try{localStorage.setItem("tt_theme","dark")}catch(e){} }
}
function toggleMenu(e){ e.stopPropagation(); const m=$("#menu"); m.style.display = m.style.display==="none"?"block":"none"; }
document.addEventListener("click",()=>{ const m=$("#menu"); if(m) m.style.display="none"; });
function doExport(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="torneio-tenis.json"; a.click(); toast("Estado exportado.");
}
function doImport(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ S=Object.assign(defaultState(), JSON.parse(r.result)); persist(); render(); toast("Estado importado."); }catch(e){ toast("Arquivo inválido."); } };
  r.readAsText(f); ev.target.value="";
}
function doReset(){
  if(!confirm("Zerar TUDO (potes, grupos e placares)? Não dá para desfazer.")) return;
  S=defaultState(); draftPlan=null; draftIdx=0; persist(); render(); toast("Torneio zerado.");
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2400); }

/* ============================================================ INIT */
initData();
</script>
</body>
